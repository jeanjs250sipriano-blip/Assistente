<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rafinha</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d2a;--mut:#6b7086;--ac:#5b5bd6;--u:#5b5bd6;--ut:#fff;--a:#fff;--bd:#e3e5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e29;--tx:#eceef7;--mut:#9095ad;--a:#1c1e29;--bd:#2b2e3d}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1c1e29;--tx:#eceef7;--mut:#9095ad;--a:#1c1e29;--bd:#2b2e3d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.dot{width:10px;height:10px;border-radius:50%;background:#3bb273}.dot.on{background:#e5484d;animation:p 1s infinite}.dot.busy{background:#f5a524}
@keyframes p{50%{opacity:.35}}
header b{font-size:17px}header small{color:var(--mut);flex:1}
button{font:inherit;color:inherit;background:none;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer}
button.ic{width:42px;height:42px;padding:0;font-size:18px;flex:none}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--bd);animation:msgIn .28s ease-out both}
.m.u{align-self:flex-end;background:var(--u);color:var(--ut);border-color:var(--u);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--a);border-bottom-left-radius:4px}
.m.s{align-self:center;font-size:13px;color:var(--mut);background:none;border-style:dashed}
.m .sp{display:block;margin-top:6px;font-size:12px;color:var(--mut);cursor:pointer}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
/* indicador digitando */
.m.typing{align-self:flex-start;background:var(--a);border-bottom-left-radius:4px;min-width:52px}
.m.typing .dots{display:inline-flex;gap:4px;align-items:center;height:16px}
.m.typing .dots i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:dotB 1.2s infinite ease-in-out}
.m.typing .dots i:nth-child(2){animation-delay:.15s}
.m.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes dotB{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
#spk{display:none;gap:6px;padding:6px 14px;background:var(--card);border-top:1px solid var(--bd)}
#bar{display:flex;gap:6px;padding:10px;background:var(--card);border-top:1px solid var(--bd);align-items:flex-end}
textarea,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%}
#in{flex:1;resize:none;max-height:120px}
#bLive.on{background:#e5484d;color:#fff;border-color:#e5484d;animation:p 1.2s infinite}
#bMic.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#imgPreview{display:none;padding:6px 10px;background:var(--card);border-top:1px solid var(--bd);align-items:center;gap:8px}
#imgPreview.show{display:flex}
#imgPreview img{height:56px;width:56px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
#imgPreview button{font-size:12px;padding:4px 10px}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--bd)}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.it small{color:var(--mut);display:block}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:15px}label.ck input{width:auto}
pre{white-space:pre-wrap;font-size:12px;margin:0}
#modes{display:flex;gap:6px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
#modes button{flex:1;font-size:13px;padding:8px 6px}#modes button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#trB{display:none;padding:6px 14px;font-size:13px;background:var(--bg);color:var(--mut);border-bottom:1px dashed var(--bd)}
/* ===== Interagir / Avatar ===== */
#interact{display:none;flex-direction:column;flex:1;min-height:0;position:relative}
#avatarStage{position:relative;flex:0 0 auto;height:42vh;max-height:380px;background:linear-gradient(180deg,#1a1a22 0%,#12131a 100%);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
#avatarImg{max-height:100%;max-width:100%;object-fit:contain;object-position:center bottom;transition:opacity .35s;user-select:none;transform-origin:center bottom}
#avatarImg.idle{animation:avatarIdle 3.2s ease-in-out infinite}
#avatarImg.speaking{animation:speakPulse .38s ease-in-out infinite alternate;filter:drop-shadow(0 0 12px rgba(91,91,214,.35))}
#avatarImg.dance{animation:avatarDance .55s ease-in-out infinite alternate}
@keyframes avatarIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes speakPulse{from{transform:scale(1) translateY(0)}to{transform:scale(1.025) translateY(-3px)}}
@keyframes avatarDance{from{transform:translateX(-8px) rotate(-2deg)}to{transform:translateX(8px) rotate(2deg)}}
#avatarLabel{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px;border-radius:8px;backdrop-filter:blur(4px)}
#avatarFloat{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
#avatarFloat button{background:rgba(28,30,41,.85);color:#eceef7;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:8px 12px;font-size:12px;backdrop-filter:blur(8px);white-space:nowrap;cursor:pointer}
#avatarFloat button:active{transform:scale(.96)}
#avatarFloat button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#interactChat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
#interactEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;text-align:center;padding:20px;pointer-events:none}

/* ===== Avatar: mídia externa, tela cheia e página de config ===== */
#avatarStage:fullscreen{height:100vh;max-height:none;border-radius:0}
#avatarStage:fullscreen #avatarImg,#avatarStage:fullscreen #avatarVid{max-height:100vh}
#avatarVid{max-height:100%;max-width:100%;object-fit:contain;object-position:center bottom;display:none;transform-origin:center bottom}
#avatarVid.idle{animation:avatarIdle 3.2s ease-in-out infinite}
#avatarVid.speaking{animation:speakPulse .38s ease-in-out infinite alternate}
#avatarVid.dance{animation:avatarDance .55s ease-in-out infinite alternate}
#bFs{position:absolute;right:10px;bottom:10px;z-index:6;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:6px 12px;font-size:12px;backdrop-filter:blur(4px);cursor:pointer}
.avgrid{display:grid;grid-template-columns:1fr;gap:8px}
.avgrid label select{font-size:13px}
.avhint{font-size:12px;color:var(--mut);line-height:1.4}
.avsec{font-weight:600;margin-top:6px;font-size:14px}

.avCmdName{flex:2;min-width:0}
.avCmdMedia{flex:2;min-width:0}
</style></style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <div style="flex:1"><b id="nm">Rafinha</b><br><small id="st">Pronta</small></div>
  <button class="ic" id="bMem" title="Memória e configurações">☰</button>
</header>
<nav id="modes">
  <button id="mChat" class="on">💬 Conversar</button>
  <button id="mInt">💃 Interagir</button>
  <button id="mTr">🧠 Treinar</button>
</nav>
<div id="trB">🧠 Modo Treinamento — o que você ensinar será revisado e só é salvo depois da sua confirmação.</div>
<div id="chat"></div>
<div id="interact">
  <div id="avatarStage">
    <img id="avatarImg" alt="Rafinha" draggable="false">
    <div id="avatarLabel">Comportada</div>
    <button id="bFs" title="Tela cheia">⛶ Tela cheia</button>
  </div>
  <div id="interactChat"></div>
</div>
<div id="spk">
  <button id="sp1">⏸ Pausar</button>
  <button id="sp2">▶ Continuar</button>
  <button id="sp3">⏹ Parar</button>
</div>
<div id="imgPreview">
  <img id="imgPrevThumb" alt="prévia">
  <span id="imgPrevName" style="flex:1;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  <button type="button" id="imgPrevClear">Remover</button>
</div>
<div id="bar">
  <button class="ic" id="bAtt" title="Anexar imagem ou arquivo">📎</button>
  <textarea id="in" rows="1" placeholder="Mensagem para o Gemini…"></textarea>
  <button class="ic" id="bLive" title="Modo Live (voz em tempo real)">⏺</button>
  <button class="ic" id="bMic" title="Falar (Gemini)">🎙</button>
  <button class="ic pri" id="bSend" title="Enviar">➤</button>
  <input type="file" id="file" hidden accept="image/*,.txt,.md,.json,.csv,.html,.htm,.pdf">
  <input type="file" id="fileImg" hidden accept="image/*">
</div>
<div id="sheet">
  <div id="tabs"></div>
  <div id="body"></div>
  <div style="padding:10px"><button style="width:100%" id="bClose">Voltar à conversa</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";

/* ========================================================================
   RAFINHA — Núcleo cognitivo refatorado
   CAPACIDADE → INTERPRETAÇÃO → COMPREENSÃO → CONTEXTO → DECISÃO → AÇÃO
   ======================================================================== */

/* ===== Utils ===== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); };
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Log = {
  items: [],
  add(t, e) {
    this.items.push(new Date().toLocaleTimeString() + " " + t + (e ? " – " + (e.message || e) : ""));
    if (this.items.length > 200) this.items.shift();
  }
};

/* ===== StorageManager (IndexedDB) ===== */
const DB = (() => {
  let db;
  const S = ["memory", "knowledge", "docs", "messages", "settings", "episodes"];
  const open = () => new Promise((ok, no) => {
    if (!window.indexedDB) return no(new Error("IndexedDB indisponível"));
    const r = indexedDB.open("assistente", 2);
    r.onupgradeneeded = e => {
      S.forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: "id" }); });
      if (e.oldVersion === 1) {
        r.transaction.objectStore("memory").openCursor().onsuccess = ev => {
          const c = ev.target.result; if (!c) return;
          const m = c.value;
          if (!m.camada) {
            m.camada = "usuario";
            m.categoria = m.tipo === "preferencia" ? "preferencia" : "pessoal";
            m.importancia = 6;
            m.criadoEm = m.data;
            m.atualizadoEm = m.data;
            m.persistente = true;
            c.update(m);
          }
          c.continue();
        };
      }
    };
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => no(r.error);
  });
  const tx = (s, m, f) => new Promise((ok, no) => {
    const t = db.transaction(s, m), q = f(t.objectStore(s));
    t.oncomplete = () => ok(q && q.result);
    t.onerror = () => no(t.error);
  });
  return {
    open,
    put: (s, o) => tx(s, "readwrite", x => x.put(o)),
    all: s => tx(s, "readonly", x => x.getAll()),
    del: (s, id) => tx(s, "readwrite", x => x.delete(id)),
    async exportAll(k) {
      const o = { versao: 1, exportadoEm: new Date().toISOString() };
      for (const s of (k ? [k] : S)) o[s] = await this.all(s);
      return o;
    },
    async importAll(o) {
      let n = 0;
      for (const s of S) for (const r of (o[s] || [])) { if (r && r.id) { await this.put(s, r); n++; } }
      return n;
    }
  };
})();

/* ===== PersonaManager / Config ===== */
const Cfg = {
  v: {
    id: "cfg",
    nome: "Rafinha",
    formal: "informal",
    tamanho: "curtas",
    voz: "",
    auto: false,
    dev: false,
    instr: "",
    geminiKey: "",
    geminiLimit: 40,
    geminiEnabled: false,
    geminiModel: "gemini-3.5-flash-lite",
    personalidadeEnvolvente: false,
    personalidadeSemFiltro: false,
    geminiTts: true,
    geminiVoice: "Kore",
    geminiTtsModel: "gemini-3.8-flash-lite-tts",
    geminiImageModel: "gemini-3.1-flash-image",
    geminiLiveModel: "gemini-3.8-live"
  },
  async load() {
    const all = await DB.all("settings");
    const c = all.find(x => x.id === "cfg");
    if (c) Object.assign(this.v, c);
    if (this.v.nome === "Aurora") this.v.nome = "Rafinha";
    if (this.v.geminiLimit == null) this.v.geminiLimit = 40;
    if (this.v.geminiEnabled == null) this.v.geminiEnabled = false;
    if (this.v.personalidadeEnvolvente == null) this.v.personalidadeEnvolvente = false;
    if (this.v.personalidadeSemFiltro == null) this.v.personalidadeSemFiltro = false;
    if (this.v.geminiTts == null) this.v.geminiTts = true;
    if (!this.v.geminiVoice) this.v.geminiVoice = "Kore";
    if (!this.v.geminiTtsModel) this.v.geminiTtsModel = "gemini-3.8-flash-lite-tts";
    if (!this.v.geminiImageModel) this.v.geminiImageModel = "gemini-3.1-flash-image";
    if (!this.v.geminiLiveModel) this.v.geminiLiveModel = "gemini-3.8-live";
    // migra modelos antigos/descontinuados ou sobrecarregados
    if (!this.v.geminiModel || /gemini-2\.0-flash|gemini-3\.8-flash$/.test(this.v.geminiModel)) {
      this.v.geminiModel = "gemini-3.5-flash-lite";
    }
  },
  save() { return DB.put("settings", this.v); }
};

/* ===== Capabilities (capacidade ≠ conhecimento ≠ memória) ===== */
const Capabilities = {
  list: [
    "interpretar texto em português (regras locais)",
    "distinguir identidade do usuário e da assistente",
    "manter contexto recente da conversa",
    "resolver referências simples (isso, ele, ela…)",
    "memorizar informações com confirmação",
    "atualizar memórias e manter histórico de alterações",
    "aprender textos e documentos (com revisão)",
    "buscar memória, conhecimento e documentos locais",
    "reconhecimento e síntese de voz (quando o navegador permitir)",
    "raciocinar sobre pessoas, relações, tempo e comparações simples (regras locais)",
    "backup e restauração local (JSON)",
    "modo treinamento separado",
    "Gemini (IA externa) opcional — ligar/desligar nas Configurações"
  ],
  canInterpret() { return true; },
  canLearn() { return true; },
  canRemember() { return true; },
  canSpeak() { return "speechSynthesis" in window; },
  canListen() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  answer(q) {
    const n = norm(q);
    if (/interpret(ar|a)|entender|compreender/.test(n))
      return "Sim. Interpreto mensagens por regras locais (intenção, sujeito, referências e contexto). Quando o Gemini estiver ligado nas Configurações, também uso o modelo de linguagem para respostas mais naturais.";
    if (/aprender|aprender|ensinar|treinar/.test(n))
      return "Sim. Posso aprender textos, documentos e informações que você me ensinar. No Modo Treinamento ou com comandos como “memorize” / “aprenda”, mostro o que entendi e só salvo após sua confirmação.";
    if (/lembrar|mem[oó]ria|guardar|memorizar/.test(n))
      return "Sim. Guardo informações persistentes neste aparelho (IndexedDB), com origem, importância e histórico de alterações. Consulto apenas o relevante.";
    if (/voz|falar|ouvir|microfone/.test(n))
      return this.canSpeak() || this.canListen()
        ? "Sim. Uso as APIs de voz do navegador (reconhecimento e síntese em pt-BR quando disponíveis)."
        : "Este navegador não oferece suporte completo a voz.";
    if (/portugu[eê]s|idioma|l[ií]ngua/.test(n))
      return "Sim. Todo o processamento de linguagem é orientado ao português brasileiro.";
    if (/documento|arquivo|pdf|txt/.test(n))
      return "Sim. Importo TXT, MD, JSON, CSV, HTML e PDF (texto extraível). Analiso, resumo e, após confirmação, aprendo como conhecimento.";
    if (/gemini|modelo de (ia|linguagem)|inteligencia artificial/.test(n))
      return Cfg.v.geminiEnabled && Cfg.v.geminiKey
        ? "Sim. O Gemini está ligado. Posso usá-lo para respostas mais naturais quando as regras locais não bastam. Você controla pelo botão nas Configurações."
        : "Tenho suporte ao Gemini, mas ele está desligado ou sem chave. Vá em ☰ → Config, cole a chave e ligue o botão “Usar Gemini”.";
    if (/capacidade|consegue|sabe fazer|o que voc[eê] (pode|sabe)/.test(n))
      return "Minhas capacidades atuais:\n• " + this.list.join("\n• ") +
        (Cfg.v.geminiEnabled && Cfg.v.geminiKey ? "\n\nGemini está ligado." : "\n\nGemini está desligado (ative em Configurações se quiser).");
    return null;
  }
};

/* ===== IdentityManager ===== */
const Identity = {
  async getAssistantName() {
    const m = (await DB.all("memory")).find(x => x.camada === "identidade" && x.chave === "nome");
    return (m && m.valor) || Cfg.v.nome || "Rafinha";
  },
  async getUserName() {
    const m = (await DB.all("memory")).find(x => x.camada === "usuario" && (x.chave === "nome" || norm(x.chave) === "nome") && x.categoria !== "preferencia");
    return m ? m.valor : null;
  },
  async setAssistantName(name, origem) {
    return Mem.save({ camada: "identidade", categoria: "identidade", chave: "nome", valor: name, importancia: 10 }, origem || "conversa");
  },
  async setUserName(name, origem) {
    return Mem.save({ camada: "usuario", categoria: "pessoal", chave: "nome", valor: name, importancia: 9 }, origem || "conversa");
  }
};

/* ===== ContextManager ===== */
const Context = {
  recent: [],
  topico: null,
  entidades: [],
  ultimaIntencao: null,
  ultimaPessoa: null,
  ultimaEntidade: null,
  pendenteRef: null,
  push(role, text) {
    this.recent.push({ role, text, t: Date.now() });
    if (this.recent.length > 24) this.recent.shift();
  },
  prevUser() {
    const u = this.recent.filter(x => x.role === "u");
    return u.length > 1 ? u[u.length - 2].text : null;
  },
  lastUser() {
    const u = this.recent.filter(x => x.role === "u");
    return u.length ? u[u.length - 1].text : null;
  },
  setTopic(t) { if (t) this.topico = t; },
  addEntity(e) {
    if (!e) return;
    const n = norm(e);
    this.entidades = this.entidades.filter(x => norm(x) !== n);
    this.entidades.unshift(e);
    if (this.entidades.length > 8) this.entidades.pop();
    this.ultimaEntidade = e;
  },
  clearSession() {
    this.recent = [];
    this.topico = null;
    this.entidades = [];
    this.ultimaIntencao = null;
    this.ultimaPessoa = null;
    this.ultimaEntidade = null;
    this.pendenteRef = null;
    this.candidatos = null;
    this.attrFoco = null;
  }
};

/* ===== ReferenceResolver ===== */
const ReferenceResolver = {
  isRef(w) {
    return /^(isso|isto|aquilo|ele|ela|eles|elas|esse|essa|esses|essas|aquele|aquela|aqueles|aquelas|aqui|ali|la|lá|agora|antes|depois)$/i.test(w);
  },
  resolve(text, ctx) {
    const n = norm(text);
    let resolved = text;
    let topic = ctx.topico;
    let entity = ctx.ultimaEntidade;

    if (/\b(isso|isto|aquilo)\b/.test(n)) {
      if (ctx.topico) {
        resolved = text.replace(/\b(isso|isto|aquilo)\b/gi, ctx.topico);
        topic = ctx.topico;
      } else if (ctx.prevUser()) {
        const prev = ctx.prevUser();
        const tags = kw(prev, 3);
        if (tags.length) {
          topic = tags[0];
          resolved = text.replace(/\b(isso|isto|aquilo)\b/gi, topic);
        }
      }
    }
    if (/\b(ele|ela)\b/.test(n) && ctx.ultimaPessoa) {
      resolved = resolved.replace(/\b(ele|ela)\b/gi, ctx.ultimaPessoa);
      entity = ctx.ultimaPessoa;
    }

/* ===== Tokens / Search helpers ===== */
const STOP = new Set("para como mais esse essa este esta isso com uma que dos das nos nas por sobre seu sua meu minha foi sao ser tem ate entre ainda tambem quando onde muito pelo pela voce sabe lembra fale nao sim ok".split(" "));
const tokens = s => norm(s).split(/[^a-z0-9]+/).filter(w => w.length > 2);
const kw = (t, n = 8) => {
  const f = {};
  tokens(t).filter(w => w.length > 3 && !STOP.has(w)).forEach(w => f[w] = (f[w] || 0) + 1);
  return Object.entries(f).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);
};
function score(q, t) {
  const T = norm(t);
  let s = 0;
  for (const w of q) if (T.includes(w)) s++;
  return q.length ? s / q.length : 0;
}

function analyze(text, nome) {
  const sents = text.split(/(?<=[.!?])\s+/).filter(s => s.length > 20);
  const tags = kw(text, 8);
  return {
    assunto: Context.topico || (nome ? nome.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ") : tags[0] || "geral"),
    tags,
    resumo: (sents.slice(0, 2).join(" ") || text).slice(0, 320),
    rel: sents.filter(s => /\d{2,4}/.test(s)).slice(0, 3),
    n: sents.length
  };
}
function knRec(a, origem, h) {
  return {
    id: uid(),
    camada: "conhecimento",
    categoria: "aprendido",
    assunto: a.assunto,
    titulo: a.assunto,

    relevantes: a.rel,

    criadoEm: today(),
    atualizadoEm: today(),
    dataCriacao: today(),
    dataAtualizacao: today(),
    importancia: 6,
    confianca: 0.9,
    persistente: true,
    hash: h
  };
}
async function learnText(t) {
  t = t.trim();
  if (t.length < 10) return say("O texto é muito curto para aprender. Envie um trecho maior ou diga o que deseja que eu memorize.");
  const h = hash(t);
  const dup = (await DB.all("knowledge")).find(k => k.hash === h);
  if (dup) return say("Já tenho esse texto (“" + (dup.assunto || dup.titulo) + "”). Nada foi duplicado.");
  const a = analyze(t);
  const rec = knRec(a, modo === "treino" ? "treinamento (texto)" : "texto colado", h);
  rec.trechos = t.match(/[\s\S]{1,900}(?:\s|$)/g) || [t];
  ask({ k: "know", rec }, "Analisei o conteúdo (" + t.length + " caracteres, " + a.n + " frases).\nAssunto provável: " + a.assunto + "\nPalavras-chave: " + a.tags.slice(0, 6).join(", ") + "\nResumo: " + a.resumo + "\n\nDeseja que eu aprenda esse conteúdo?");
}

/* ===== RetrievalManager ===== */
const Retrieve = {
  async find(q, lim = 6) {
    const Q = tokens(q).filter(w => !STOP.has(w));
    if (!Q.length) return [];
    const out = [];
    for (const m of await DB.all("memory"))
      out.push({ src: "memória", cam: m.camada || "usuario", rec: m, txt: (m.assunto || "") + " " + m.chave + " " + m.valor, w: 1 + (m.importancia || 5) / 10 });
    for (const k of await DB.all("knowledge"))
      out.push({ src: "conhecimento", rec: k, txt: (k.assunto || k.titulo || "") + " " + (k.tags || []).join(" ") + " " + (k.valor || k.conteudo || "") + " " + (k.trechos || []).join(" "), w: 1.2 });
    for (const e of await DB.all("episodes"))
      out.push({ src: "episódio", rec: e, txt: e.resumo, w: 0.7 });
    for (const d of await DB.all("docs"))
      if (d.aprendido) d.chunks.forEach(c => out.push({ src: "documento", rec: d, txt: c, w: 0.9, doc: d.nome }));
    const r = out.map(x => ({ ...x, sc: score(Q, x.txt) * x.w })).filter(x => x.sc >= 0.4).sort((a, b) => b.sc - a.sc).slice(0, lim);
    for (const x of r) {
      if (x.src === "memória") {
        x.rec.usos = (x.rec.usos || 0) + 1;
        x.rec.ultimoUso = today();
        DB.put("memory", x.rec).catch(() => {});
      }
    }
    return r;
  }
};
const fmt = x => {
  const r = x.rec;
  if (x.src === "memória") return "• [memória " + x.cam + "] " + r.chave + ": " + r.valor;
  if (x.src === "conhecimento") return "• [conhecimento] " + (r.assunto || r.titulo) + ": " + String(r.valor || r.conteudo).slice(0, 220);
  if (x.src === "episódio") return "• [lembrança] " + r.resumo;
  return "• [documento " + x.doc + "] " + x.txt.slice(0, 200) + "…";
};

/* ===== DocumentManager ===== */
const Docs = (() => {
  const MAX = 15 * 1024 * 1024;
  const EXT = ["txt", "md", "json", "csv", "html", "htm", "pdf"];
  const chunk = (t, n = 1000) => {
    const out = [];
    let i = 0;
    while (i < t.length) {
      let e = Math.min(i + n, t.length);
      if (e < t.length) { const b = t.lastIndexOf(". ", e); if (b > i + n * 0.5) e = b + 1; }
      out.push(t.slice(i, e).trim());
      i = e;
    }
    return out.filter(Boolean);
  };
  async function pdf(buf) {
    if (!window.pdfjsLib) throw new Error("Biblioteca de PDF não carregou (sem internet?)");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const d = await pdfjsLib.getDocument({ data: buf }).promise;
    let t = "";
    for (let p = 1; p <= d.numPages; p++) {
      const c = await (await d.getPage(p)).getTextContent();
      t += c.items.map(i => i.str).join(" ") + "\n";
    }
    return { text: t, paginas: d.numPages };
  }
  async function process(f) {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (!EXT.includes(ext)) throw new Error("Tipo não suportado (." + ext + "). Use TXT, MD, JSON, CSV, HTML ou PDF.");
    if (f.size > MAX) throw new Error("Arquivo maior que 15 MB.");
    let text, paginas = null;
    if (ext === "pdf") {
      const r = await pdf(await f.arrayBuffer());
      text = r.text;
      paginas = r.paginas;
    } else {
      text = await f.text();
      if (ext === "html" || ext === "htm") text = new DOMParser().parseFromString(text, "text/html").body.textContent;
    }
    text = text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    if (!text) throw new Error("Não encontrei texto neste arquivo (PDF escaneado precisa de OCR, ainda não disponível).");
    return { id: uid(), nome: f.name, tipo: ext, hash: hash(text), chars: text.length, paginas, chunks: chunk(text), aprendido: false, data: today() };
  }
  return { process };
})();

  }
};

      $("#dot").className = "dot";
    }
  },

  async _playBase64Audio(b64, mime) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    // WAV completo (unary) ou PCM cru
    let ab = bytes.buffer;
    if (!/wav|wave/i.test(mime || "") && bytes.length > 44) {
      // Empacota PCM 24kHz mono 16-bit em WAV
      ab = this._pcmToWav(bytes, 24000).buffer;
    }

    if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this._ctx.state === "suspended") await this._ctx.resume();

    const audioBuf = await this._ctx.decodeAudioData(ab.slice(0));
    return new Promise(resolve => {
      const src = this._ctx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(this._ctx.destination);
      this._src = src;
      this._playing = true;
      const spk = $("#spk"); if (spk) spk.style.display = "flex";
      if (typeof Avatar !== "undefined") Avatar.setSpeaking(true);
      src.onended = () => {
        this._playing = false;
        this._src = null;
        if (spk) spk.style.display = "none";
        if (typeof Avatar !== "undefined") Avatar.setSpeaking(false);
        resolve();
      };
      src.start(0);
    });
  },

  _pcmToWav(pcmBytes, sampleRate) {
    const n = pcmBytes.length;
    const buf = new ArrayBuffer(44 + n);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n, true);
    new Uint8Array(buf, 44).set(pcmBytes);
    return new Uint8Array(buf);
  }
};

const GeminiImage = {
  async generate(prompt) {
    if (!(await AIProvider.canUseGemini())) return { error: "Gemini desligado ou sem cota." };
    const key = Cfg.v.geminiKey.trim();
    const model = Cfg.v.geminiImageModel || "gemini-3.1-flash-image";
    setSt("Gerando imagem…");
    $("#dot").className = "dot busy";
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: { responseModalities: ["TEXT", "IMAGE"] }
        })
      });
      const data = await res.json();
      if (!res.ok) {
        const msg = (data.error && data.error.message) || ("HTTP " + res.status);
        return { error: msg };
      }
      await GeminiUsage.inc();
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      let text = "", img = null;
      for (const p of parts) {
        if (p.text) text += p.text;
        if (p.inlineData && /image\//i.test(p.inlineData.mimeType || "")) {
          img = { mime: p.inlineData.mimeType, data: p.inlineData.data };
        }
      }
      if (!img) return { error: "Modelo não retornou imagem. " + (text || "") };
      return { text: text || "Imagem gerada.", img };
    } catch (e) {
      return { error: e.message || String(e) };
    } finally {
      setSt("Pronta");
      $("#dot").className = "dot";
    }
  },

  showInChat(result) {
    if (result.error) return say("Não consegui gerar a imagem: " + result.error);
    const box = getChatEl();
    const d = document.createElement("div");
    d.className = "m a";
    if (result.text) {
      const p = document.createElement("div");
      p.textContent = result.text;
      d.appendChild(p);
    }
    const im = document.createElement("img");
    im.src = "data:" + result.img.mime + ";base64," + result.img.data;
    im.alt = "Imagem gerada";
    im.style.cssText = "max-width:100%;border-radius:12px;margin-top:8px;display:block";
    d.appendChild(im);
    const actions = document.createElement("div");
    actions.className = "sp";
    actions.style.cssText = "display:flex;gap:8px;margin-top:6px";
    const bDl = document.createElement("span");
    bDl.textContent = "⬇ baixar";
    bDl.style.cursor = "pointer";
    bDl.onclick = () => {
      const a = document.createElement("a");
      a.href = im.src;
      a.download = "rafinha-" + Date.now() + ".png";
      a.click();
    };
    actions.appendChild(bDl);
    d.appendChild(actions);
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    Context.push("a", result.text || "[imagem gerada]");
  }
};

const GeminiLive = {
  ws: null,
  active: false,
  _rec: null,
  _audioCtx: null,
  _playTime: 0,
  _transcript: "",

  isOn() { return this.active && this.ws && this.ws.readyState === 1; },

  async start() {
    if (!(await AIProvider.canUseGemini())) {
      sys("Ligue o Gemini e configure a chave em Config para usar o modo Live.");
      return false;
    }
    if (this.active) return true;
    const key = Cfg.v.geminiKey.trim();
    const model = Cfg.v.geminiLiveModel || "gemini-3.8-live";
    const voice = Cfg.v.geminiVoice || "Kore";
    const nome = Cfg.v.nome || "Rafinha";

    const system = `Você é ${nome}, assistente pessoal do Jean. Fale português brasileiro de forma natural e calorosa.` +
      (Cfg.v.personalidadeSemFiltro ? " Tom íntimo e ousado quando apropriado." :
        Cfg.v.personalidadeEnvolvente ? " Tom carinhoso e brincalhão." : "");

    const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(key)}`;
    setSt("Conectando Live…");
    $("#dot").className = "dot busy";

    return new Promise(resolve => {
      try {
        this.ws = new WebSocket(wsUrl);
      } catch (e) {
        sys("WebSocket indisponível: " + e.message);
        resolve(false);
        return;
      }
      this.ws.onopen = () => {
        this.ws.send(JSON.stringify({
          setup: {
            model: "models/" + model,
            responseModalities: ["AUDIO"],
            systemInstruction: { parts: [{ text: system }] },
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } }
            },
            inputAudioTranscription: {},
            outputAudioTranscription: {}
          }
        }));
      };
      this.ws.onmessage = async (ev) => {
        let msg;
        try {
          const raw = typeof ev.data === "string" ? ev.data : await ev.data.text();
          msg = JSON.parse(raw);
        } catch (e) { return; }
        if (msg.setupComplete) {
          this.active = true;
          setSt("● Live ativo");
          $("#dot").className = "dot on";
          const bl = $("#bLive"); if (bl) bl.classList.add("on");
          const bm = $("#bMic"); if (bm) bm.classList.add("on");
          this._startMic().then(() => resolve(true)).catch(() => resolve(true));
          return;
        }
        if (msg.serverContent) {
          const sc = msg.serverContent;
          if (sc.modelTurn && sc.modelTurn.parts) {
            for (const part of sc.modelTurn.parts) {
              if (part.inlineData && part.inlineData.data) {
                this._playPcmChunk(part.inlineData.data, part.inlineData.mimeType);
              }
              if (part.text) {
                this._transcript += part.text;
              }
            }
          }
          if (sc.outputTranscription && sc.outputTranscription.text) {
            this._transcript = sc.outputTranscription.text;
          }
          if (sc.inputTranscription && sc.inputTranscription.text) {
            // opcional: mostrar o que o usuário falou
          }
          if (sc.turnComplete && this._transcript) {
            bubble("a", this._transcript.trim());
            Context.push("a", this._transcript.trim());
            this._transcript = "";
          }
        }
        if (msg.error) {
          Log.add("live error", msg.error);
          sys("Live: " + (msg.error.message || JSON.stringify(msg.error)));
        }
      };
      this.ws.onerror = () => {
        sys("Erro na conexão Live.");
        this.stop();
        resolve(false);
      };
      this.ws.onclose = () => {
        this.active = false;
        this._stopMic();
        setSt("Pronta");
        $("#dot").className = "dot";
      };
    });
  },

  stop() {
    this.active = false;
    this._stopMic();
    if (this.ws) {
      try { this.ws.close(); } catch (e) {}
      this.ws = null;
    }
    setSt("Pronta");
    $("#dot").className = "dot";
    const bl = $("#bLive"); if (bl) bl.classList.remove("on");
    const bm = $("#bMic"); if (bm) bm.classList.remove("on");
    if (typeof Avatar !== "undefined") Avatar.setSpeaking(false);
  },

  sendText(t) {
    if (!this.isOn() || !t) return;
    this.ws.send(JSON.stringify({ realtimeInput: { text: t } }));
  },

  async _startMic() {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    });
    this._audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const src = this._audioCtx.createMediaStreamSource(stream);
    const proc = this._audioCtx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = e => {
      if (!this.isOn()) return;
      const input = e.inputBuffer.getChannelData(0);
      // float32 -> int16 PCM
      const pcm = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      const bytes = new Uint8Array(pcm.buffer);
      let b64 = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      b64 = btoa(b64);
      try {
        this.ws.send(JSON.stringify({
          realtimeInput: { audio: { data: b64, mimeType: "audio/pcm;rate=16000" } }
        }));
      } catch (err) {}
    };
    src.connect(proc);
    proc.connect(this._audioCtx.destination);
    this._rec = { stream, src, proc };
  },

  _stopMic() {
    if (this._rec) {
      try { this._rec.proc.disconnect(); this._rec.src.disconnect(); } catch (e) {}
      try { this._rec.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
      this._rec = null;
    }
  },

  async _playPcmChunk(b64, mime) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (!this._playCtx) this._playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    if (this._playCtx.state === "suspended") await this._playCtx.resume();
    // PCM 16-bit mono 24kHz
    const samples = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));
    const f32 = new Float32Array(samples.length);
    for (let i = 0; i < samples.length; i++) f32[i] = samples[i] / 32768;
    const buf = this._playCtx.createBuffer(1, f32.length, 24000);
    buf.copyToChannel(f32, 0);
    const src = this._playCtx.createBufferSource();
    src.buffer = buf;
    src.connect(this._playCtx.destination);
    const now = this._playCtx.currentTime;
    if (this._playTime < now) this._playTime = now;
    src.start(this._playTime);
    this._playTime += buf.duration;
    if (typeof Avatar !== "undefined") Avatar.setSpeaking(true);
    src.onended = () => {
      if (this._playTime <= this._playCtx.currentTime + 0.05) {
        if (typeof Avatar !== "undefined") Avatar.setSpeaking(false);
      }
    };
  }
};

/* ===== VoiceManager ===== */
const Voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  let listening = false; // modo contínuo: só para quando o usuário clicar de novo
  // Buffer no nível do módulo → permite reset no send / clear do input
  let fin = [];
  let sessFin = [];
  let interim = "";
  let onTextCb = null;
  let onStopCb = null;
  const ok = () => !!SR;
  const synOk = () => "speechSynthesis" in window;

  /*MERGE*/
  // No Android cada resultado "final" repete a frase inteira até ali: funde em vez de somar
  const merge = (list, t) => {
    const L = list[list.length - 1], a = norm(t), b = L ? norm(L) : "";
    if (!L) list.push(t);
    else if (a.startsWith(b)) list[list.length - 1] = t;      // t estende o trecho anterior
    else if (b.startsWith(a) || b.endsWith(a)) { /* repetição menor: ignora */ }
    else list.push(t);
  };
  const compose = arr => { const out = []; arr.filter(Boolean).forEach(t => merge(out, t.trim())); return out.join(" ").replace(/\s+/g, " ").trim(); };
  const all = () => compose([...fin, ...sessFin, interim]);
  /*ENDMERGE*/

  function listen(onText, onStop) {
    if (!SR) return sys("Este navegador não oferece suporte a reconhecimento de voz.");
    if (listening) return;
    listening = true;
    onTextCb = onText;
    onStopCb = onStop;
    // Começa limpo se o input estiver vazio; senão usa o que já está digitado como prefixo
    const prefix = ($("#in").value || "").trim();
    fin = prefix ? [prefix] : [];
    sessFin = [];
    interim = "";

    const startRec = () => {
      if (!listening) return;
      rec = new SR();
      rec.lang = "pt-BR";
      rec.continuous = true;
      rec.interimResults = true;
      sessFin = []; interim = "";
      rec.onresult = e => {   // reconstrói a sessão inteira a cada evento (não acumula por índice)
        sessFin = []; interim = "";
        for (const r of Array.from(e.results)) {
          const t = r[0].transcript.trim(); if (!t) continue;
          if (r.isFinal) merge(sessFin, t); else interim = t;
        }
        if (onTextCb) onTextCb(all());
      };
      rec.onerror = e => {
        Log.add("voz erro", e.error);
        if (e.error === "not-allowed") { listening = false; sys("Não foi possível acessar o microfone (permissão negada)."); }
      };
      rec.onend = () => {
        rec = null;
        [...sessFin, interim].filter(Boolean).forEach(t => merge(fin, t));   // não perde o que ainda era parcial
        sessFin = []; interim = "";
        if (onTextCb) onTextCb(all());
        if (listening) {
          setTimeout(() => {
            if (!listening) return;
            try { startRec(); } catch (err) { listening = false; if (onStopCb) onStopCb(all()); }
          }, 250);
        } else if (onStopCb) onStopCb(all());
      };
      try { rec.start(); } catch (e) { listening = false; sys("Não foi possível iniciar o microfone."); if (onStopCb) onStopCb(all()); }
    };
    startRec();
  }

  /** Zera o buffer de transcrição */
  const resetBuffer = () => {
    fin = [];
    sessFin = [];
    interim = "";
  };

  const cancel = () => {
    listening = false;
    onTextCb = null;
    onStopCb = null;
    resetBuffer();
    if (rec) {
      try { rec.abort(); } catch (e) {}
      rec = null;
    }
    setSt("Pronta");
    $("#dot").className = "dot";
  };

  const stop = () => {
    // Para o modo contínuo sem abortar de forma brusca
    listening = false;
    if (rec) {
      try { rec.stop(); } catch (e) {
        try { rec.abort(); } catch (e2) {}
      }
    }
  };

  /** Para o mic e zera o buffer — chamado no envio da mensagem */
  const stopAndClear = () => {
    listening = false;
    onTextCb = null;
    onStopCb = null;
    resetBuffer();
    if (rec) {
      try { rec.abort(); } catch (e) {}
      rec = null;
    }
    setSt("Pronta");
    $("#dot").className = "dot";
  };

  function speak(t) {
    // Prioridade absoluta: Gemini TTS (nunca mistura com voz do navegador)
    try { speechSynthesis.cancel(); } catch (e) {}
    try { GeminiAudio.stop(); } catch (e) {}
    if (Cfg.v.geminiEnabled && Cfg.v.geminiKey && Cfg.v.geminiTts !== false) {
      GeminiAudio.speak(t).then(ok => {
        if (!ok) {
          // só cai no navegador se o TTS do Gemini falhar de verdade
          speakBrowser(t);
        }
      });
      return;
    }
    speakBrowser(t);
  }
  function speakBrowser(t) {
    if (!synOk()) return;
    try { speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "pt-BR";
    const v = pick();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = 1.05;
    u.onstart = () => {
      $("#spk").style.display = "flex";
      if (typeof Avatar !== "undefined") Avatar.setSpeaking(true);
    };
    u.onend = u.onerror = () => {
      $("#spk").style.display = "none";
      if (typeof Avatar !== "undefined") Avatar.setSpeaking(false);
    };
    speechSynthesis.speak(u);
  }
  function pick() {
    const allV = speechSynthesis.getVoices();
    const sel = allV.find(v => v.name === Cfg.v.voz);
    if (sel) return sel;
    let pt = allV.filter(v => /^pt[-_]BR/i.test(v.lang));
    if (!pt.length) pt = allV.filter(v => /^pt/i.test(v.lang));
    const sc = v => {
      const n = v.name.toLowerCase();
      let x = 0;
      if (/francisca|thalita|luciana|fernanda|camila|vit[oó]ria|google portugu[eê]s do brasil|natural|online/.test(n)) x += 3;
      if (/female|feminin/.test(n)) x += 2;
      if (/antonio|daniel|felipe|ricardo|luciano|\bmale\b|masculin/.test(n)) x -= 5;
      if (/^pt[-_]BR/i.test(v.lang)) x += 1;
      return x;
    };
    return pt.sort((a, b) => sc(b) - sc(a))[0] || null;
  }
  return {
    ok,
    synOk,
    listen,
    cancel,
    stop,
    stopAndClear,
    resetBuffer,
    speak,
    pick,
    active: () => listening || !!rec,
    voices: () => synOk() ? speechSynthesis.getVoices().filter(v => v.lang.startsWith("pt")) : []
  };
})();

  const LABELS = {
    comportada: ["Comportada completa", "Sem blazer", "Lingerie", "Sem sutiã", "Nua"],
    sexy: ["Sexy completa", "Sexy parcialmente", "Lingerie sexy", "Sem sutiã", "Nua"]
  };
  /* ================= NOVO MOTOR DE MÍDIA (pasta / uploads / padrão) ================= */
  const state = { outfit: "comportada", undress: 0, pose: "idle", speaking: false };

  const AvatarCfg = {
    v: { initial: "comportada", assets: {}, uploads: {} },
    dir: null,
    async load() {
      const all = await DB.all("settings");
      const c = all.find(x => x.id === "avatarCfg");
      if (c) Object.assign(this.v, c);
      this.dir = (all.find(x => x.id === "avatarDir") || {}).handle || null;
      state.outfit = this.v.initial === "sexy" ? "sexy" : "comportada";
    },
    async save() { await DB.put("settings", { id: "avatarCfg", ...this.v }); },
    async saveDir(h) { this.dir = h; await DB.put("settings", { id: "avatarDir", handle: h }); }
  };
  let readyP = null;
  const ready = () => readyP || (readyP = AvatarCfg.load());

  function mediaKind(name, mime) {
    mime = mime || "";
    if (mime.startsWith("video") || /\.(mp4|webm|mov|m4v)$/i.test(name)) return "video";
    if (/\.gif$/i.test(name)) return "gif";
    return "image";
  }

  let curUrl = null;
  async function resolveMedia(ref) {
    if (!ref) return null;
    if (ref.src === "file" && AvatarCfg.dir) {
      try {
        const f = await (await AvatarCfg.dir.getFileHandle(ref.name)).getFile();
        return { kind: mediaKind(f.name, f.type), url: URL.createObjectURL(f), file: true };
      } catch (e) { return null; }
    }
    const u = ref.src === "data" && AvatarCfg.v.uploads[ref.name];
    return u ? { kind: u.kind, url: u.dataUrl } : null;
  }

  function currentKey() {
    if (state.pose.startsWith("custom:") && AvatarCfg.v.assets[state.pose]) return state.pose;
    if (state.pose === "dance" && AvatarCfg.v.assets["dance"]) return "dance";
    if (state.pose === "strip" && AvatarCfg.v.assets["strip"]) return "strip";
    return state.outfit + ":" + state.undress;
  }

  function label() {
    if (state.pose.startsWith("custom:")) {
      const c = (AvatarCfg.v.custom || []).find(x => "custom:" + x.id === state.pose);
      return c ? "▶ " + c.cmd : "Comando";
    }
    const base = state.outfit === "sexy" ? "Sexy" : "Comportada";
    if (state.pose === "dance") return "Dançando 💃";
    if (state.undress >= 4) return base + " · Nua";
    if (state.undress > 0) return base + " · Peça " + state.undress;
    return base;
  }

  async function render() {
    await ready();
    const stage = $("#avatarStage"); if (!stage) return;
    const img = $("#avatarImg");
    let vid = $("#avatarVid");
    const key = currentKey();
    const media = await resolveMedia(AvatarCfg.v.assets[key]);

    if (curUrl && (!media || media.file)) { try { URL.revokeObjectURL(curUrl); } catch (e) {} curUrl = null; }

    if (media && media.kind === "video") {
      if (media.file) curUrl = media.url;
      if (!vid) {
        vid = document.createElement("video");
        vid.id = "avatarVid"; vid.playsInline = true; vid.muted = true; vid.loop = true;
        stage.insertBefore(vid, img);
      }
      if (vid.src !== media.url) vid.src = media.url;
      vid.className = state.pose + (state.speaking ? " speaking" : "");
      if (key === "strip") { vid.loop = false; vid.onended = () => { state.pose = "idle"; render(); }; }
      else { vid.loop = true; vid.onended = null; }
      img.style.display = "none"; vid.style.display = "block";
      vid.play().catch(() => {});
    } else {
      if (vid) { vid.pause(); vid.style.display = "none"; }
      img.style.display = "block";
      img.src = media ? media.url : ((IMAGES[state.outfit] || {})[state.undress] || "");
      img.className = state.pose + (state.speaking ? " speaking" : "");
    }
    const lb = $("#avatarLabel"); if (lb) lb.textContent = label();
  }

  function setOutfit(o) { state.outfit = o; state.undress = 0; state.pose = "idle"; render(); return "Agora estou de " + (o === "sexy" ? "roupa sexy 🔥" : "roupa comportada 👔") + "."; }
  function strip(steps) {
    steps = steps || 1;
    const b = state.undress;
    state.undress = Math.min(4, state.undress + steps);
    state.pose = (AvatarCfg.v.assets["strip"] && state.undress < 4) ? "strip" : "idle";
    render();
    if (state.undress === b) return "Já estou sem roupa.";
    return ["", "Tirei a peça de cima…", "Agora só de lingerie.", "Tirei o sutiã.", "Fiquei nua para você. 😏"][state.undress];
  }
  function dress() { state.undress = 0; state.pose = "idle"; render(); return "Me vesti de novo."; }
  function dance() { state.pose = "dance"; render(); return "Dançando para você… 💃"; }
  function idle() { state.pose = "idle"; render(); return "Parei."; }
  function setSpeaking(on) { state.speaking = !!on; render(); }
  function toggleFs(on) {
    const st = $("#avatarStage");
    if (on) { const r = st.requestFullscreen || st.webkitRequestFullscreen; if (r) r.call(st); return "Abrindo em tela cheia…"; }
    if (document.fullscreenElement) document.exitFullscreen();
    return "Saindo da tela cheia.";
  }

  function goInteract() {
    try { if (typeof modo !== "undefined" && modo === "chat") { const b = $("#mInt"); if (b) b.click(); } } catch (e) {}
  }

      const nc = norm(c.cmd || "");
      if (nc.length >= 3 && n.includes(nc) && AvatarCfg.v.assets["custom:" + c.id]) {

        render();
        return "Prontinho… " + c.cmd + " 😏";
      }
    }
    if (/\b(tela cheia|fullscreen)\b/.test(n)) return toggleFs(true);
    if (/\b(sair da tela cheia|sai da tela cheia)\b/.test(n)) return toggleFs(false);

    if (/\b(dan[cç]a|dance|rebola)\b/.test(n)) return dance();
    if (/\b(para de dan[cç]ar|para a[ií]|fica quieta)\b/.test(n)) return idle();
    return null;
  }

// chat ativo: #chat no modo conversa/treino, #interactChat no modo interagir
function getChatEl() {

}
let modo = "chat";
function setSt(t) { $("#st").textContent = t; }
function downloadBlob(content, filename, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime || "text/plain;charset=utf-8" }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function extractCodeBlocks(text) {
  // Detecta blocos ```lang ... ``` e também HTML solto
  const blocks = [];
  const re = /```(\w*)\n?([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const lang = (m[1] || "").toLowerCase();
    const code = m[2].trim();
    if (!code) continue;
    let ext = "txt", mime = "text/plain;charset=utf-8";
    if (lang === "html" || lang === "htm" || /^<!doctype html|<html[\s>]/i.test(code)) {
      ext = "html"; mime = "text/html;charset=utf-8";
    } else if (lang === "css") { ext = "css"; mime = "text/css;charset=utf-8"; }
    else if (lang === "js" || lang === "javascript") { ext = "js"; mime = "text/javascript;charset=utf-8"; }
    else if (lang === "json") { ext = "json"; mime = "application/json;charset=utf-8"; }
    else if (lang === "md" || lang === "markdown") { ext = "md"; mime = "text/markdown;charset=utf-8"; }
    else if (lang === "py" || lang === "python") { ext = "py"; }
    else if (lang === "csv") { ext = "csv"; mime = "text/csv;charset=utf-8"; }
    blocks.push({ code, ext, mime, lang: lang || "texto" });
  }
  // HTML completo sem fence
  if (!blocks.length && /<!doctype html|<html[\s>]/i.test(text) && text.length > 80) {
    blocks.push({ code: text.trim(), ext: "html", mime: "text/html;charset=utf-8", lang: "html" });
  }
  return blocks;
}

function bubble(role, text, save = true) {
  const d = document.createElement("div");
  d.className = "m " + role;
  d.textContent = text;

  const actions = document.createElement("div");
  actions.className = "sp";
  actions.style.display = "flex";
  actions.style.flexWrap = "wrap";
  actions.style.gap = "8px";
  actions.style.marginTop = "6px";

  // Copiar
  const bCopy = document.createElement("span");
  bCopy.textContent = "📋 copiar";
  bCopy.style.cursor = "pointer";
  bCopy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      bCopy.textContent = "✅ copiado";
      setTimeout(() => { bCopy.textContent = "📋 copiar"; }, 1500);
    } catch (e) {
      // fallback
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      bCopy.textContent = "✅ copiado";
      setTimeout(() => { bCopy.textContent = "📋 copiar"; }, 1500);
    }
  };
  actions.appendChild(bCopy);

  if (role === "a") {
    const bSpeak = document.createElement("span");
    bSpeak.textContent = "🔊 ouvir";
    bSpeak.style.cursor = "pointer";
    bSpeak.onclick = () => Voice.speak(text);
    actions.appendChild(bSpeak);

    // Botões de download para blocos de código / HTML
    const blocks = extractCodeBlocks(text);
    blocks.forEach((b, i) => {
      const btn = document.createElement("span");
      const name = "rafinha-" + (b.lang || "arquivo") + (blocks.length > 1 ? "-" + (i + 1) : "") + "." + b.ext;
      btn.textContent = "⬇ " + b.ext.toUpperCase();
      btn.title = "Baixar " + name;
      btn.style.cursor = "pointer";
      btn.onclick = () => downloadBlob(b.code, name, b.mime);
      actions.appendChild(btn);
    });

    // Se não houver bloco, mas o texto for longo e parecer código/arquivo, oferece TXT
    if (!blocks.length && text.length > 200 && (/function |const |let |class |import |<!|<div|<style|def |SELECT /i.test(text))) {
      const btn = document.createElement("span");
      btn.textContent = "⬇ TXT";
      btn.style.cursor = "pointer";
      btn.onclick = () => downloadBlob(text, "rafinha-texto.txt", "text/plain;charset=utf-8");
      actions.appendChild(btn);
    }
  }

  d.appendChild(actions);
  const box = getChatEl();
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  // Interagir compartilha o histórico com Conversar
  const saveModo = (modo === "interagir") ? "chat" : modo;
  if (save && role !== "s") DB.put("messages", { id: uid(), role, text, modo: saveModo, t: Date.now() }).catch(e => Log.add("salvar msg", e));
}

/* ========================================================================
   CognitiveCore — INTERPRETAR antes de executar
   ======================================================================== */
const Core = {
  strip(t) {
    const n = Cfg.v.nome.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return t.replace(new RegExp("^\\s*" + n + "\\s*[,:!\\-]+\\s*", "i"), "").trim();
  },

  /* Extrai itens de memória a partir de afirmações estruturadas */
  classifyItems(b) {
    b = b.trim().replace(/[.!]+$/, "");
    let m;
    const U = (cat, chave, valor, imp, x) => ({ camada: "usuario", categoria: cat, chave, valor, importancia: imp, ...x });

    // Identidade da assistente: "seu nome é X", "você se chama X", "te chamo de X"
    if (m = b.match(/^(?:a partir de agora\s+)?(?:seu nome (?:é|e)|voc[eê] se chama|te chamo de)\s+(.+)$/i))
      return [{ camada: "identidade", categoria: "identidade", chave: "nome", valor: m[1].trim(), importancia: 10 }];

    // "eu sou X, o/a seu/sua Y"
    if (m = b.match(/^(?:ol[aá][.,]?\s*)?eu sou\s+(.+?),?\s+(?:o\s+|a\s+)?seu\s+(.+)$/i))
      return [U("pessoal", "nome", m[1].trim(), 9), U("relação", "relação com a assistente", m[1].trim() + " é meu(minha) " + m[2].trim(), 8)];

    // Nome do usuário
    if (m = b.match(/^(?:meu nome (?:é|e)|me chamo)\s+(.+)$/i))
      return [U("pessoal", "nome", m[1].trim(), 9)];

    // Preferências
    if (m = b.match(/^(?:que\s+)?(?:eu\s+)?(prefiro|gosto de|gosto que)\s+(.+)$/i))
      return [U("preferencia", "preferência: " + m[2].trim().slice(0, 40), m[1] + " " + m[2].trim(), 7)];

    // Projeto
    if (m = b.match(/^(?:meu|minha)\s+(projeto(?:\s+principal)?)\s+(?:se chama|é|e)\s+(.+)$/i))
      return [U("projeto", m[1], m[2].trim(), 8, { assunto: m[2].trim() })];

    // "meu/minha X é/se chama Y"
    if (m = b.match(/^(?:meu|minha)\s+(.+?)\s+(?:é|e|se chama)\s+(.+)$/i))
      return [U("pessoal", m[1].trim(), m[2].trim(), 6)];

    // "meu irmão se chama João" já coberto acima; fallback genérico de relação
    if (m = b.match(/^(?:o|a)\s+(?:meu|minha)\s+(.+?)\s+(?:se chama|é|e)\s+(.+)$/i))
      return [U("pessoal", m[1].trim(), m[2].trim(), 6)];

    return [];
  },

  nota(b) {
    return { camada: "usuario", categoria: "nota", chave: (kw(b, 2).join(" ") || "nota") + " (nota)", valor: b.replace(/^Entendi:\s*/i, ""), importancia: 6 };
  },

  interpret(raw, ctx) {
    const t = this.strip(raw);
    const n = norm(t);
    let m;
    const base = {
      raw, t, tipo: "afirmacao", intencao: "conversar",
      temporal: "indefinido", neg: /\b(nao|nunca|jamais)\b/.test(n),
      ref: /\b(isso|isto|ele|ela|aquilo)\b/.test(n),
      assunto: null, items: [], confianca: 0.6,
      requerMemoria: false, requerConhecimento: false, requerAprendizado: false,
      requerConfirmacao: false, requerFerramenta: false
    };
    const R = o => ({ ...base, ...o });

    // Tipo básico
    if (/\?\s*$/.test(t) || /^(qual|quais|quem|quando|onde|como|o que|por que|quanto|voce (sabe|lembra|consegue|pode))\b/.test(n))
      base.tipo = "pergunta";
    else if (/^(guarde|memorize|esqueca|aprenda|procure|busque|mostre|quero|vou|leia|adicione|anote|grave|registre)\b/.test(n))
      base.tipo = "comando";

    // Comandos de sistema
    if (/^\/?ajuda$/.test(n)) return R({ intencao: "ajuda", confianca: 1 });
    if (/^\/(backup|exportar)/.test(n)) return R({ intencao: "backup", confianca: 1 });
    if (/^\/(memoria|conhecimento|documentos|projetos)/.test(n)) return R({ intencao: "painel", painel: "mem", confianca: 1 });
    if (/^\/configuracoes/.test(n)) return R({ intencao: "painel", painel: "cf", confianca: 1 });
    if (/^\/treinamento/.test(n)) return R({ intencao: "modo", modo: "treino", confianca: 1 });
    if (/^\/conversa/.test(n)) return R({ intencao: "modo", modo: "chat", confianca: 1 });

    // Capacidade (antes de memória!)
    if (/voc[eê]\s+(sabe|consegue|pode|é capaz de)\s+(interpretar|entender|aprender|lembrar|falar|ouvir|memorizar|guardar)/.test(n) ||
        /voc[eê]\s+sabe\s+interpretar/.test(n) ||
        /voc[eê]\s+consegue\s+(aprender|lembrar)/.test(n) ||
        /o que voc[eê]\s+(pode|sabe)\s+fazer/.test(n) ||
        /quais s[aã]o suas capacidades/.test(n) ||
        /voc[eê]\s+entende\s+portugu[eê]s/.test(n)) {
      return R({ intencao: "capacidade", tipo: "pergunta", confianca: 0.95 });
    }

    // Identidade da assistente
    if (/(qual e o seu nome|como voce se chama|quem e voce|quem voce e|qual o seu nome)/.test(n))
      return R({ intencao: "consultar_identidade", tipo: "pergunta", confianca: 0.95 });

    // Identidade / memória do usuário
    if (/^quem sou eu\??$/.test(n))
      return R({ intencao: "consultar_usuario", chave: "nome", tipo: "pergunta", confianca: 0.95 });
    if (m = t.match(/^qual\s+(?:é|e)\s+(?:o\s+|a\s+)?(?:meu|minha)\s+(.+?)\??$/i))
      return R({ intencao: "consultar_usuario", chave: m[1].replace(/\?$/, "").trim(), tipo: "pergunta", confianca: 0.9 });
    if (m = t.match(/^como\s+(?:é|e|se chama)\s+(?:o\s+|a\s+)?(?:meu|minha)\s+(.+?)\??$/i))
      return R({ intencao: "consultar_usuario", chave: m[1].replace(/\?$/, "").trim(), tipo: "pergunta", confianca: 0.9 });

    // Consultar assunto / conhecimento / memória
    if (m = t.match(/(?:o que voc[eê] sabe (?:sobre|de|do|da)|me fale (?:sobre|de|do|da)|fale (?:sobre|de|do|da)|voc[eê] lembra (?:de|do|da|sobre))\s+(.+?)\??$/i))
      return R({ intencao: "consultar_assunto", assunto: m[1].replace(/\?$/, "").trim(), tipo: "pergunta", requerMemoria: true, requerConhecimento: true, confianca: 0.85 });

    // Aprender texto explícito
    if (m = t.match(/^(?:aprenda isso|aprenda este texto|memorize este texto)\s*[:\-]?\s*([\s\S]+)$/i))
      return R({ intencao: "aprender_texto", texto: m[1].trim(), requerAprendizado: true, requerConfirmacao: true, confianca: 0.9 });

    // Esquecer
    if (m = t.match(/^(?:esque[cç]a|apague|n[aã]o precisa lembrar(?: d[eoa])?)\s+(.+)$/i))
      return R({ intencao: "esquecer", assunto: m[1].replace(/[.!]$/, "").replace(/^(?:sobre|a informa[cç][aã]o (?:sobre|de)|meu|minha|o|a)\s+/i, "").trim(), requerConfirmacao: true, confianca: 0.85 });

    // Memorizar explícito
    if (m = t.match(/^(?:guarde|memorize|grave|registre|anote|lembre-se)(?:\s+isso)?(?:\s+na sua mem[oó]ria)?(?:\s+(?:que|de que))?\s*[:,]?\s*([\s\S]*)$/i)) {
      let b = m[1].trim();
      if (!b || /^(isso|esta informa[cç][aã]o|essa informa[cç][aã]o)[.!]?$/i.test(b)) b = ctx.prevUser() || "";
      if (!b) return R({ intencao: "conversar", aviso: "O que devo memorizar? Diga, por exemplo: “memorize que meu projeto se chama JORNADA”.", confianca: 0.7 });
      const it = this.classifyItems(b);
      return R({ intencao: "memorizar", temporal: "permanente", items: it.length ? it : [this.nota(b)], requerConfirmacao: true, confianca: 0.9 });
    }

    // Ensinar
    if (m = t.match(/^(?:quero|vou)\s+(?:te\s+)?ensinar(?:\s+(?:voc[eê]\s+)?(?:sobre|a hist[oó]ria d[eoa]s?|a|o))?\s+(.+)$/i))
      return R({ intencao: "ensinar", assunto: m[1].replace(/[.!]$/, "").trim(), requerAprendizado: true, confianca: 0.9 });

    // Buscar documentos
    if (m = t.match(/^(?:procure|busque|pesquise)\s+(?:no|nos)?\s*(?:documentos?|arquivo)?\s*(?:a informa[cç][aã]o\s+)?(?:sobre|de|do|da)?\s*(.+)$/i))
      return R({ intencao: "buscar_doc", assunto: m[1].trim(), requerFerramenta: true, confianca: 0.85 });
    if (/^(quais|quantos)\s+documentos/.test(n)) return R({ intencao: "listar_docs", confianca: 0.9 });
    if (/mostre o que voce aprendeu|o que voce lembra\??$/.test(n)) return R({ intencao: "mostrar", confianca: 0.85 });

    // Informações que podem ser memorizadas (afirmações estruturadas)
    const it = this.classifyItems(t);
    if (it.length) return R({ intencao: "informar", temporal: "permanente", items: it, requerConfirmacao: true, confianca: 0.85 });

    // Estado / emoção
    if (m = t.match(/^(estou|tô|to|me sinto|ando)\s+(.+?)[.!]?$/i))

      if (ref.topic) return R({ intencao: "ensinar", assunto: ref.topic, requerAprendizado: true, confianca: 0.8 });

    }

    return R({ confianca: 0.5 });
  }
};

/*MIND*/
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const RELS = { irmao: ["irmão", "m"], irma: ["irmã", "f"], pai: ["pai", "m"], mae: ["mãe", "f"], filho: ["filho", "m"], filha: ["filha", "f"], amigo: ["amigo", "m"], amiga: ["amiga", "f"], esposa: ["esposa", "f"], marido: ["marido", "m"], primo: ["primo", "m"], prima: ["prima", "f"], tio: ["tio", "m"], tia: ["tia", "f"], avo: ["avô/avó", "?"], namorado: ["namorado", "m"], namorada: ["namorada", "f"], chefe: ["chefe", "?"], colega: ["colega", "?"] };
const RELW = "irm[ãa]o|irm[ãa]|pai|m[ãa]e|filh[oa]|amig[oa]|esposa|marido|prim[oa]|tio|tia|av[ôóo]|namorad[oa]|chefe|colega";

const NOTNAME = new Set("hoje ontem amanha agora eu ele ela isso talvez acho estou quero minha meu depois antes qual onde quem como quanto quando quantos voce isso gosto trabalho moro tenho sou adoro amo vivo nasci quero".split(" "));

const gen = (nome, rel) => {
  if (rel) { const r = Object.values(RELS).find(x => x[0] === rel); if (r && r[1] !== "?") return r[1]; }
  const n = norm(nome || ""); if (n.length < 3) return "?";
  return /a$/.test(n) ? "f" : /o$/.test(n) ? "m" : "?";
};
const inverse = (R, gA, gB) =>
  (R === "filho" || R === "filha") ? (gB === "f" ? "mãe" : gB === "m" ? "pai" : "pai/mãe") :
  (R === "pai" || R === "mãe") ? (gA === "f" ? "filha" : gA === "m" ? "filho" : "filho(a)") :
  (R === "irmão" || R === "irmã") ? (gB === "f" ? "irmã" : gB === "m" ? "irmão" : "irmão(ã)") :
  R === "marido" ? "esposa" : R === "esposa" ? "marido" : null;
const CONFLITA = new Set(["residencia", "idade", "trabalho", "naturalidade", "nome", "nascimento"]);
const LABU = { residencia: "residência", idade: "idade", trabalho: "trabalho", naturalidade: "naturalidade", ocupacao: "ocupação", nome: "nome", nascimento: "data de nascimento" };
const LABQ = { residencia: "onde você mora", naturalidade: "de onde você é", idade: "quantos anos você tem", trabalho: "onde você trabalha", ocupacao: "o que você faz", nascimento: "quando você nasceu" };
const KEYRE = { residencia: /morar|moro|mora\b|residen|cidade/, naturalidade: /nasc|natural/, idade: /idade|\banos/, trabalho: /trabalh/, ocupacao: /ocupa|profiss/, nascimento: /nasc/ };
const idadeDe = v => { const m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/), h = new Date(); if (m) { let a = h.getFullYear() - +m[3]; if (h.getMonth() + 1 < +m[2] || (h.getMonth() + 1 === +m[2] && h.getDate() < +m[1])) a--; return a; } return /^\d{4}$/.test(String(v)) ? h.getFullYear() - +v : null; };

/* ---- EntityManager: entidades, atributos (com tempo) e relações; vivem no contexto ---- */
const EntityManager = {
  list: [], foco: [], tick: 0, hyd: false,
  user: { id: "user", nome: "você", tipo: "usuario", genero: "?", rel: null, attrs: {}, rels: [], ultimoUso: 0 },
  find(n) { const k = norm(n); return this.list.find(e => norm(e.nome) === k); },
  get(nome, rel, noBump) {
    let e = nome ? this.find(nome) : null;
    if (!e && rel) e = this.list.find(y => y.rel === rel && (!nome || y.anonimo));
    if (!e) { e = { id: uid(), nome: nome || "sua " + rel, anonimo: !nome, tipo: "pessoa", rel: rel || null, genero: "?", attrs: {}, rels: [], ultimoUso: 0 }; this.list.push(e); }
    else if (nome && e.anonimo) { e.nome = nome; e.anonimo = false; }

    const g = gen(e.anonimo ? "" : e.nome, e.rel); if (g !== "?") e.genero = g;

  },
  lookup(nome, rel) { return nome ? this.find(nome) : (rel ? this.list.find(y => y.rel === rel) : null); },
  addFact(e, a, valor, o) {   // detectContradiction embutido
    const l = (e.attrs[a] = e.attrs[a] || []);
    const cur = l.filter(f => !f.temp && !f.neg).pop();
    if (a === "nascimento" && cur && (String(cur.valor).includes(valor) || String(valor).includes(cur.valor))) return {};
    if (!o.temp && !o.neg && o.fonte !== "memoria" && cur && CONFLITA.has(a) && norm(cur.valor) !== norm(valor)) return { conflito: cur };
    if (!l.some(f => norm(f.valor) === norm(valor) && !!f.neg === !!o.neg && f.temp === (o.temp || null)))
      l.push({ valor, neg: !!o.neg, temp: o.temp || null, dia: today(), fonte: o.fonte || "conversa", conf: o.conf || 0.9 });

  },
  val(e, a, hoje) {
    const fs = (e.attrs[a] || []).filter(f => !(f.temp === "hoje" && f.dia !== today()));

  },
  addRel(a, R, b) {
    a.rels.push({ rel: R, alvo: b.nome, inf: false });
    const iv = inverse(R, a.genero, b.genero);
    if (iv) b.rels.push({ rel: iv, alvo: a.nome, inf: true });   // inferência segura: só inversas diretas
    return iv;
  },
  async hydrate() {   // reconstrói entidades a partir da memória persistente confirmada
    this.hyd = true;
    for (const m of await DB.all("memory")) {
      if (m.categoria === "preferencia" && m.camada === "usuario") {
        const v = String(m.valor).replace(/^(gosto de|prefiro|gosto que)\s*/i, "");
        if (!(this.user.attrs.gosto || []).some(f => norm(f.valor) === norm(v))) (this.user.attrs.gosto = this.user.attrs.gosto || []).push({ valor: v, temp: null, fonte: "memoria", conf: 1 });
      }
      if (m.camada === "usuario" && m.categoria === "nota") {   // notas antigas viram fatos estruturados na sessão
        for (const sg of String(m.valor).split(/\n+|(?<=[.!?])\s+/)) { const p = Interpreter.clause(sg.trim().replace(/[.!]+$/, ""), null); if (p && p.subj.user && !p.temp && !p.neg && !["estado", "desejo"].includes(p.attr)) this.addFact(this.user, p.attr, p.valor, { fonte: "memoria", conf: 0.8 }); }
        continue;
      }
      if (!m.ent) continue;
      const e = m.ent === "__usuario__" ? this.user : this.get(/^sua /.test(m.ent) ? null : m.ent, m.rel, true);
      if (m.attr === "relacao") { const x = String(m.valor).match(/^(\S+) de (.+)$/); if (x && !e.rels.some(r => r.alvo === x[2])) e.rels.push({ rel: x[1], alvo: x[2], inf: false }); }
      else this.addFact(e, m.attr, m.valor, { fonte: "memoria", conf: 1 });

  },
  resolvePron(p) {   // ele/ela: gênero + foco da última fala + recência; nunca "última pessoa" às cegas
    const g = /^ela/.test(p) ? "f" : "m", ok = e => e.tipo === "pessoa" && (e.genero === "?" || e.genero === g);
    const c = this.foco.map(id => this.list.find(e => e.id === id)).filter(e => e && ok(e));
    if (c.length === 1) return { e: c[0], conf: 0.9 };
    if (c.length > 1) return { amb: c, conf: 0.3 };
    const r = this.list.filter(ok).sort((a, b) => b.ultimoUso - a.ultimoUso)[0];
    return r ? { e: r, conf: 0.6 } : { conf: 0 };
  }
};

/* ---- Interpreter: análise estrutural da frase (tempo, sujeito, predicado) ---- */
const PRED = [
  [/^(?:nasceu|nasci)\s+(?:em|no dia|dia)\s+(\d{1,2}\/\d{1,2}\/\d{4}|\d{4})$/i, "nascimento"],
  [/^sou\s+d[eo]\s+(\d{4})$/i, "nascimento"],
  [/^sou\s+d[eo]\s+(.+)$/i, "naturalidade"],
  [/^(?:mora|moram|moro|vive|vivem|vivo|reside)\s+(?:em|na|no)\s+(.+)$/i, "residencia"],
  [/^(?:est[áa]|est[ãa]o|estou|estava|estar[áa])\s+(?:em|na|no)\s+(.+)$/i, "localizacao"],
  [/^(?:est[áa]|est[ãa]o|estou)\s+(aqui|ali|l[áa])$/i, "localizacao"],
  [/^(?:tem|tenho)\s+(\d+)(?:\s+anos)?$/i, "idade"],
  [/^(?:trabalha|trabalho)\s+(?:em|na|no|numa|num|como|de|com)\s+(.+)$/i, "trabalho"],
  [/^(?:se chama|chama-se)\s+(.+)$/i, "nome"],
  [/^(?:nasceu|nasci)\s+(?:em|na|no)\s+(.+)$/i, "naturalidade"],
  [/^(?:gosta|gosto)\s+de\s+(.+)$/i, "gosto"],
  [/^(?:adora|adoro|ama|amo)\s+(.+)$/i, "gosto"],
  [/^(?:quer|quero|querem)\s+(.+)$/i, "desejo"],
  [/^(?:é|foi|sou)\s+(filh[oa]|pai|m[ãa]e|irm[ãa]o|irm[ãa]|marido|esposa|amig[oa]|prim[oa]|tio|tia)\s+d[eoa]s?\s+(.+)$/i, "relacao"],
  [/^(?:sou)\s+(?:um\s+|uma\s+|o\s+|a\s+)?(.+)$/i, "ocupacao"],
  [/^(?:est[áa]|estou|estava)\s+(.+)$/i, "estado"]

const Interpreter = {
  kind(s) {   // fato / opinião / possibilidade / relato / pergunta

    if (/\b(acho|acredito|na minha opiniao)\b/.test(n)) return "opiniao";
    if (/\b(talvez|quem sabe|pode ser que)\b/.test(n)) return "possibilidade";
    if (/\bontem\b/.test(n)) return "relato";
    return "fato";
  },
  temporal(c) {
    const m = c.match(/\b(hoje|agora|neste momento|no momento|ontem|amanh[ãa]|atualmente)\b/i);
    if (!m) return { c, temp: null };
    const w = norm(m[1]);
    return { c: c.replace(m[0], "").replace(/\s{2,}/g, " ").replace(/^[\s,]+|[\s,]+$/g, ""), temp: w === "ontem" ? "passado" : /amanha/.test(w) ? "futuro" : w === "atualmente" ? null : "hoje" };
  },
  clauses(s) {

  },
  subj(q) {   // sujeito em perguntas

    if (m = q.match(/\b(ele|ela|dele|dela)\b/i)) return { pron: m[1].toLowerCase().replace("dele", "ele").replace("dela", "ela") };
    const w = q.split(/\s+/).slice(1).join(" ");
    if ((m = w.match(new RegExp("\\b(" + CN + ")"))) && !NOTNAME.has(norm(m[1]))) return { nome: m[1] };

  },
  clause(c, prev) {

    else if (m = x.match(/^([Ee]le|[Ee]la)\s+(.*)$/)) { s = { pron: m[1].toLowerCase() }; x = m[2]; }
    else if (m = x.match(/^[Ee]u\s+(.*)$/)) { s = { user: true }; x = m[1]; }
    else if ((m = x.match(new RegExp("^(" + CN + "(?:\\s" + CN + ")?)\\s+(.*)$"))) && !NOTNAME.has(norm(m[1]))) { s = { nome: m[1] }; x = m[2]; }
    else if (/^(estou|tenho|moro|gosto|quero|trabalho|nasci|vivo|sou|adoro|amo)\b/i.test(x)) s = { user: true };
    else s = prev;
    x = x.trim(); if (/^n[ãa]o\s/i.test(x)) { neg = true; x = x.replace(/^n[ãa]o\s+/i, ""); }
    if (!s) return null;
    for (const [re, a] of PRED) if (m = x.match(re)) return a === "relacao" ? { subj: s, attr: a, relw: normRel(m[1]), valor: m[2].trim(), neg, temp: t.temp } : { subj: s, attr: (a === "ocupacao" && new RegExp("^" + CN + "$").test(m[1].trim())) ? "nome" : a, valor: m[1].trim(), neg, temp: t.temp };

/* ---- apresentação neutra dos fatos (a persona decide o tom; aqui só a informação) ---- */
const who = e => e.tipo === "usuario" ? "você" : e.rel ? ((e.genero === "f" ? "sua " : "seu ") + e.rel + (e.anonimo ? "" : " " + e.nome)) : e.nome;
const LAB = { residencia: x => "onde " + x + " mora", localizacao: x => "onde " + x + " está", idade: x => "a idade de " + x, trabalho: x => "onde " + x + " trabalha", naturalidade: x => "onde " + x + " nasceu", gosto: x => "do que " + x + " gosta" };

    trabalho: "trabalha em " + v, naturalidade: "nasceu em " + v, gosto: "gosta de " + v, desejo: "quer " + v, nome: "se chama " + v, estado: "está " + v, ocupacao: "é " + v, nascimento: "nasceu em " + v

const P = (texto, x) => ({ acao: "RESPONDER", texto, conf: 0.9, ...x });
function calc(s) {   // calculadora segura (sem eval)
  let i = 0; const ws = () => { while (s[i] === " ") i++; };
  const num = () => { ws(); if (s[i] === "(") { i++; const v = add(); ws(); i++; return v; } let sg = 1; if (s[i] === "-") { sg = -1; i++; ws(); } const m = s.slice(i).match(/^\d+(?:\.\d+)?/); if (!m) throw 0; i += m[0].length; return sg * parseFloat(m[0]); };

  const v = add(); ws(); if (i < s.length || !isFinite(v)) throw 0; return v;
}
Tools.register("calculadora", "Calcula expressões aritméticas", calc);

/* ---- ReasoningEngine: entende, relaciona, compara, infere; devolve PLANOS (não escreve no banco) ---- */
const ReasoningEngine = {
  splitQ(s) {   // decomposição de perguntas compostas e elípticas
    s = s.replace(/\?\s*$/, "");
    let parts = s.split(/\s*,?\s+e\s+(?=(?:qual|quais|onde|quem|quanto|quantos|como|quando)\b)/i);
    if (parts.length === 1) { const m = s.match(/^(.*?)\s+e\s+(?:o|a)\s+(seu|sua|dele|dela)$/i); if (m) parts = [m[1], m[1].replace(/\b(meu|minha)\b/i, m[2])]; }

  },
  expr(n) {
    const e = n.replace(/(\d),(\d)/g, "$1.$2").replace(/\s+(?:vezes|x|multiplicado por)\s+/g, " * ").replace(/\s+mais\s+/g, " + ").replace(/\s+menos\s+/g, " - ").replace(/\s+dividido por\s+/g, " / ");
    return /^[\d\s.+\-*/()]+$/.test(e) && /\d/.test(e) ? e.trim() : null;
  },
  async entOf(sj) {   // resolveReference / resolveEntity
    if (!sj) return { none: true };
    if (sj.pron) { const r = EntityManager.resolvePron(sj.pron); return r.e ? { e: r.e, conf: r.conf, pron: sj.pron } : r.amb ? { amb: r.amb } : { none: true }; }
    let e = EntityManager.lookup(sj.nome, sj.rel);
    if (!e && !EntityManager.hyd) { await EntityManager.hydrate(); e = EntityManager.lookup(sj.nome, sj.rel); }
    return e ? { e, conf: 0.95 } : { none: true, sj };
  },
  missing(r, sj) { return P("Você ainda não me falou sobre " + (sj && sj.rel ? "sua " + sj.rel : sj && sj.nome ? sj.nome : "isso") + ".", { faltando: true }); },
  clarify(amb, s) { const op = amb.map(e => e.nome); return { acao: "PEDIR_ESCLARECIMENTO", texto: "Você está falando " + op.map((o, i) => (i ? "ou d" : "d") + (/a$/i.test(o) ? "a " : "o ") + o).join(" ") + "?", pend: { k: "esclarece", s, op } }; },
  compare(n) {
    const c = EntityManager.list.filter(e => e.tipo === "pessoa" && EntityManager.val(e, "idade")).sort((a, b) => b.ultimoUso - a.ultimoUso).slice(0, 6);
    if (c.length < 2) return P("Preciso da idade de pelo menos duas pessoas para comparar, e você ainda não me deu isso.", { faltando: true });
    const age = e => +EntityManager.val(e, "idade").valor, mais = /velh/.test(n), s = [...c].sort((a, b) => mais ? age(b) - age(a) : age(a) - age(b));

    return P(cap(nm(s[0])) + " é mais " + (mais ? "velh" : "nov") + (s[0].genero === "f" ? "a" : "o") + " (" + age(s[0]) + " anos, contra " + age(s[1]) + " de " + nm(s[1]) + ").");

    const n = norm(q).replace(/[?!.]/g, "").trim(); let m;
    if ((m = n.match(/^e (?:o|a) (meu|minha|seu|sua)$/)) && Context.attrFoco && Sess.n - Context.attrFoco.n <= 3) return this.ask("Qual é o " + m[1] + " nome?");
    if (/\bmeu nome\b/.test(n)) {

/* ---- DecisionEngine: escolhe a AÇÃO a partir dos planos (RESPONDER, PERGUNTAR, MEMORIZAR, CORRIGIR…) ---- */
const DecisionEngine = {
  run(plans) {
    const ask = plans.find(p => p.acao === "PEDIR_ESCLARECIMENTO" || p.acao === "CORRIGIR");
    if (ask) { if (ask.pend) pending = ask.pend; return say(ask.texto); }
    const acks = plans.flatMap(p => p.ack || []), items = plans.flatMap(p => p.items || []);
    let txt = plans.filter(p => !p.ack && p.texto).map(p => p.texto).join(" ");
    if (acks.length) { const a = acks.length > 1 ? "Entendi:\n• " + acks.map(cap).join("\n• ") : "Entendi: " + (/^(Sua|Seu|Você)\b/.test(acks[0]) ? acks[0][0].toLowerCase() + acks[0].slice(1) : acks[0]) + "."; txt = txt ? txt + "\n" + a : a; }
    if (items.length) {
      Context.candidatos = items; Context.candN = Sess.n;
      if (modo === "chat") return say(txt + dica());   // conversa normal: não interrompe com pergunta
      pending = { k: "mem", items, o: "conversa" }; return say(txt + "\nQuer que eu memorize isso?");
    }
    say(txt);
  }
};
const Mind = {
  async extract(text) {   // extrai itens estruturados de um texto com várias linhas/frases
    const items = [];
    for (const sg of text.split(/\n+|(?<=[.!?])\s+/).map(x => x.trim()).filter(Boolean)) {
      const pl = await ReasoningEngine.absorb(sg);
      if (pl && pl.items && pl.items.length) { items.push(...pl.items); continue; }
      if (!pl || pl.acao === "RESPONDER") items.push(...Core.classifyItems(sg));
    }
    return items;
  },
  async run(text, r) {
    text = text.replace(/^Entendi:\s*/i, "");
    // Resposta elíptica completa: "O meu é Jean" / "Meu nome é Jean"
    const el = text.match(/^(?:o|a)\s+(?:meu|minha)\s+(?:nome\s+)?(?:é|e)\s+(.+?)[.!]?$/i) ||
               text.match(/^(?:meu nome (?:é|e)|me chamo)\s+(.+?)[.!]?$/i);
    if (el && Context.attrFoco && Context.attrFoco.attr === "nome" && Sess.n - Context.attrFoco.n <= 5) {
      const v = el[1].trim(); EntityManager.addFact(EntityManager.user, "nome", v, {});
      DecisionEngine.run([P("Entendi: seu nome é " + v + ".", { items: [{ camada: "usuario", categoria: "pessoal", chave: "nome", valor: v, ent: "__usuario__", attr: "nome", importancia: 9 }] })]); return true;
    }
    // Resposta só com o nome: "Jean" / "Sou o Jean" logo após ela ter pedido o nome
    if (Context.attrFoco && Context.attrFoco.attr === "nome" && Sess.n - Context.attrFoco.n <= 5) {
      const bare = text.replace(/[.!?]+$/, "").trim();
      const mName = bare.match(/^(?:(?:eu\s+)?(?:sou\s+(?:o|a)\s+)?|me\s+chamo\s+)?([A-ZÁÀÂÃÉÊÍÓÔÕÚÇ][a-záàâãéêíóôõúç]+(?:\s+[A-ZÁÀÂÃÉÊÍÓÔÕÚÇ][a-záàâãéêíóôõúç]+){0,2})$/);
      if (mName && bare.length <= 40 && !/^(sim|nao|ok|claro|obrigad)/i.test(bare)) {
        const v = mName[1].trim();
        EntityManager.addFact(EntityManager.user, "nome", v, {});
        Context.attrFoco = null;
        DecisionEngine.run([P("Entendi: seu nome é " + v + ".", { items: [{ camada: "usuario", categoria: "pessoal", chave: "nome", valor: v, ent: "__usuario__", attr: "nome", importancia: 9 }] })]);
        return true;
      }
    }
    const rc = text.match(/^(?:mas\s+)?(?:eu\s+)?(?:j[áa]\s+)?(?:te\s+)?(?:disse|falei)\s+(?:isso\s+)?(?:que\s+)?(.+)$/i);   // "Mas disse que sou de 1992"
    if (rc) {
      if (!EntityManager.hyd) await EntityManager.hydrate();
      const p = Interpreter.clause(rc[1].replace(/[.!]+$/, ""), null), f = p && p.subj.user ? EntityManager.val(EntityManager.user, p.attr) : null;
