/* ===== banco (camada única sobre IndexedDB) ===== */
const DB=(()=>{let db;const S=["memory","knowledge","docs","messages","settings","episodes"];
const open=()=>new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error("IndexedDB indisponível"));const r=indexedDB.open("assistente",2);

return{open,put:(s,o)=>tx(s,"readwrite",x=>x.put(o)),all:s=>tx(s,"readonly",x=>x.getAll()),del:(s,id)=>tx(s,"readwrite",x=>x.delete(id)),

/* ===== busca textual local ===== */
const tokens=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>2);
function score(q,t){const T=norm(t);let s=0;for(const w of q)if(T.includes(w))s++;return q.length?s/q.length:0}
const Search={mem:q=>Retrieve.find(q),async docs(q){const Q=tokens(q),r=[];for(const d of await DB.all("docs"))d.chunks.forEach((c,i)=>{const s=score(Q,c);if(s>=.5)r.push({nome:d.nome,trecho:c,sc:s,i})});return r.sort((a,b)=>b.sc-a.sc)}};
/* ===== documentos ===== */
const Docs=(()=>{const MAX=15*1024*1024,EXT=["txt","md","json","csv","html","htm","pdf"];
const chunk=(t,n=1000)=>{const out=[];let i=0;while(i<t.length){let e=Math.min(i+n,t.length);if(e<t.length){const b=t.lastIndexOf(". ",e);if(b>i+n*.5)e=b+1}out.push(t.slice(i,e).trim());i=e}return out.filter(Boolean)};
async function pdf(buf){if(!window.pdfjsLib)throw new Error("Biblioteca de PDF não carregou (sem internet?)");
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const d=await pdfjsLib.getDocument({data:buf}).promise;let t="";for(let p=1;p<=d.numPages;p++){const c=await(await d.getPage(p)).getTextContent();t+=c.items.map(i=>i.str).join(" ")+"\n"}return{text:t,paginas:d.numPages}}
async function process(f){const ext=(f.name.split(".").pop()||"").toLowerCase();
if(!EXT.includes(ext))throw new Error("Tipo não suportado (.\u200b"+ext+"). Use TXT, MD, JSON, CSV, HTML ou PDF.");
if(f.size>MAX)throw new Error("Arquivo maior que 15 MB.");
let text,paginas=null;
if(ext==="pdf"){const r=await pdf(await f.arrayBuffer());text=r.text;paginas=r.paginas}
else{text=await f.text();if(ext==="html"||ext==="htm")text=new DOMParser().parseFromString(text,"text/html").body.textContent}
text=text.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
if(!text)throw new Error("Não encontrei texto neste arquivo (PDF escaneado precisa de OCR, ainda não disponível).");
return{id:uid(),nome:f.name,tipo:ext,hash:hash(text),chars:text.length,paginas,chunks:chunk(text),aprendido:false,data:today()}}
return{process}})();
/* ===== IA (interface trocável; provedor local por regras, sem modelo) ===== */
const AIProvider={nome:"LocalRules",async generateResponse(){return null},async summarize(t){const s=t.split(/(?<=[.!?])\s+/).filter(Boolean);return s.slice(0,2).join(" ").slice(0,220)},
async classify(t){return/^(meu|minha|me chamo)/i.test(t)?"memoria":/^prefiro/i.test(t)?"preferencia":"conversa"},async extractMemory(){return[]},async analyzeDocument(d){return{resumo:d.chunks[0].slice(0,200)}}};

const AndroidBridge={isAvailable:()=>false,_n(){return"Recurso disponível somente na versão Android."},flashlightOn(){return this._n()},flashlightOff(){return this._n()},setBrightness(){return this._n()},setVolume(){return this._n()},openApplication(){return this._n()},lockScreen(){return this._n()}};
const SyncProvider={ativo:false,nome:"Local (sincronização desativada)"};
const Tools={list:{},register(n,d,f){this.list[n]={d,f}},run(n,a){Log.add("ferramenta "+n);return this.list[n].f(a)}};
Tools.register("memoria.buscar","Busca na memória e conhecimento",q=>Search.mem(q));
Tools.register("documentos.buscar","Busca em documentos",q=>Search.docs(q));
/* ===== voz ===== */
const Voice=(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const ok=()=>!!SR,synOk=()=>"speechSynthesis"in window;
function listen(onText,onEnd){if(!SR)return sys("Este navegador não oferece suporte a reconhecimento de voz.");
rec=new SR();rec.lang="pt-BR";rec.interimResults=true;let fin="";
rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;fin=t;onText(t)};
rec.onerror=e=>{Log.add("voz erro",e.error);sys(e.error==="not-allowed"?"Não foi possível acessar o microfone (permissão negada).":"Erro no reconhecimento de voz: "+e.error)};
rec.onend=()=>{rec=null;onEnd(fin)};try{rec.start()}catch(e){sys("Não foi possível iniciar o microfone.")}}
const cancel=()=>{if(rec){rec.onend=()=>{rec=null;setSt("Pronta");$("#dot").className="dot"};rec.abort()}};
function speak(t){if(!synOk())return sys("Este navegador não oferece síntese de voz.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";
const v=pick();if(v){u.voice=v;u.lang=v.lang}u.rate=1.05;u.onstart=()=>$("#spk").style.display="flex";u.onend=u.onerror=()=>$("#spk").style.display="none";speechSynthesis.speak(u)}
function pick(){const all=speechSynthesis.getVoices();const sel=all.find(v=>v.name===Cfg.v.voz);if(sel)return sel;
let pt=all.filter(v=>/^pt[-_]BR/i.test(v.lang));if(!pt.length)pt=all.filter(v=>/^pt/i.test(v.lang));
const sc=v=>{const n=v.name.toLowerCase();let x=0;if(/francisca|thalita|luciana|fernanda|camila|vit[oó]ria|google portugu[eê]s do brasil|natural|online/.test(n))x+=3;if(/female|feminin/.test(n))x+=2;if(/antonio|daniel|felipe|ricardo|luciano|\bmale\b|masculin/.test(n))x-=5;if(/^pt[-_]BR/i.test(v.lang))x+=1;return x};
return pt.sort((a,b)=>sc(b)-sc(a))[0]||null}
return{ok,synOk,listen,cancel,speak,pick,active:()=>!!rec,voices:()=>synOk()?speechSynthesis.getVoices().filter(v=>v.lang.startsWith("pt")):[]}})();
/* ===== interface de chat ===== */
const chat=$("#chat");let modo="chat";
function setSt(t){$("#st").textContent=t}
function bubble(role,text,save=true){const d=document.createElement("div");d.className="m "+role;d.textContent=text;
if(role==="a"){const s=document.createElement("span");s.className="sp";s.textContent="🔊 ouvir";s.onclick=()=>Voice.speak(text);d.appendChild(s)}
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
if(save&&role!=="s")DB.put("messages",{id:uid(),role,text,modo,t:Date.now()}).catch(e=>Log.add("salvar msg",e))}
const sys=t=>bubble("s",t,false);
function say(t){bubble("a",t);Ctx.push("a",t);if(Cfg.v.auto)Voice.speak(t)}
/* ===== contexto recente e sessão (→ memória episódica) ===== */
const Ctx={recent:[],topico:null,push(role,t){this.recent.push({role,t});if(this.recent.length>12)this.recent.shift()},prevUser(){const u=this.recent.filter(x=>x.role==="u");return u.length>1?u[u.length-2].t:null}};
const Sess={n:0,tok:{},saved:0,mode:"chat"};
const Episodes={async consolidate(){if(Sess.n<4)return;const top=Object.entries(Sess.tok).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
const resumo="Em "+new Date().toLocaleDateString("pt-BR")+", conversa ("+(Sess.mode==="treino"?"treinamento":"normal")+") com "+Sess.n+" mensagens"+(top.length?" sobre: "+top.join(", "):"")+(Sess.saved?"; "+Sess.saved+" item(ns) memorizado(s)":"")+".";
await DB.put("episodes",{id:uid(),camada:"episodica",resumo,assuntos:top,origem:"conversa",criadoEm:today(),importancia:3,confianca:.7,persistente:true});Sess.n=0;Sess.tok={};Sess.saved=0}};
/* ===== recuperação de memória (só o que for relevante) ===== */
const STOP=new Set("para como mais esse essa este esta isso com uma que dos das nos nas por sobre seu sua meu minha foi sao ser tem ate entre ainda tambem quando onde muito pelo pela voce sabe lembra fale".split(" "));
const kw=(t,n=8)=>{const f={};tokens(t).filter(w=>w.length>4&&!STOP.has(w)).forEach(w=>f[w]=(f[w]||0)+1);return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0])};
const Retrieve={async find(q,lim=6){const Q=tokens(q).filter(w=>!STOP.has(w));if(!Q.length)return[];const out=[];
for(const m of await DB.all("memory"))out.push({src:"memória",cam:m.camada||"usuario",rec:m,txt:(m.assunto||"")+" "+m.chave+" "+m.valor,w:1+(m.importancia||5)/10});
for(const k of await DB.all("knowledge"))out.push({src:"conhecimento",rec:k,txt:(k.assunto||k.titulo||"")+" "+(k.tags||[]).join(" ")+" "+(k.valor||k.conteudo||"")+" "+(k.trechos||[]).join(" "),w:1.2});
for(const e of await DB.all("episodes"))out.push({src:"episódio",rec:e,txt:e.resumo,w:.7});
for(const d of await DB.all("docs"))if(d.aprendido)d.chunks.forEach(c=>out.push({src:"documento",rec:d,txt:c,w:.9,doc:d.nome}));
const r=out.map(x=>({...x,sc:score(Q,x.txt)*x.w})).filter(x=>x.sc>=.45).sort((a,b)=>b.sc-a.sc).slice(0,lim);

const fmt=x=>{const r=x.rec;return x.src==="memória"?"• [memória "+x.cam+"] "+r.chave+": "+r.valor:x.src==="conhecimento"?"• [conhecimento] "+(r.assunto||r.titulo)+": "+String(r.valor||r.conteudo).slice(0,220):x.src==="episódio"?"• [lembrança] "+r.resumo:"• [documento "+x.doc+"] "+x.txt.slice(0,200)+"…"};
/* ===== memória estruturada (com atualização, sem verdades concorrentes) ===== */
const Mem={async save(it,origem){const all=await DB.all("memory"),nk=norm(it.chave),ex=all.find(m=>m.camada===it.camada&&norm(m.chave)===nk),now=today();
if(ex){if(norm(ex.valor)===norm(it.valor))return{st:"igual"};const de=ex.valor;ex.anterior=[...(ex.anterior||[]),{valor:de,ate:now}];ex.valor=it.valor;ex.atualizadoEm=now;ex.origem=origem||ex.origem;await DB.put("memory",ex);this.after(ex);return{st:"atualizado",de}}

/*CORE*/

const toYou=s=>s.replace(/\bmeus\b/gi,"seus").replace(/\bminhas\b/gi,"suas").replace(/\bmeu\b/gi,"seu").replace(/\bminha\b/gi,"sua").replace(/\bmim\b/gi,"você");
const Core={
strip(t){const n=Cfg.v.nome.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp("^\\s*"+n+"\\s*[,:!\\-]+\\s*","i"),"").trim()},
classify(b){b=b.trim().replace(/[.!]+$/,"");let m;const U=(cat,chave,valor,imp,x)=>({camada:"usuario",categoria:cat,chave,valor,importancia:imp,...x});

if(m=b.match(/^(?:meu|minha)\s+(projeto(?:\s+principal)?)\s+(?:se chama|é|e)\s+(.+)$/i))return[U("projeto",m[1],m[2],8,{assunto:m[2]})];
if(m=b.match(/^(?:meu|minha)\s+(.+?)\s+(?:é|e|se chama)\s+(.+)$/i))return[U("pessoal",m[1],m[2],6)];
return[]},
nota(b){return{camada:"usuario",categoria:"nota",chave:b.split(/\s+/).slice(0,5).join(" "),valor:b,importancia:6}},
interpret(raw,ctx){const t=this.strip(raw),n=norm(t);let m;
const r={raw,t,tipo:"afirmacao",intencao:"conversar",temporal:"indefinido",neg:/\b(nao|nunca|jamais)\b/.test(n),ref:/\b(isso|isto|ele|ela|aquilo)\b/.test(n),assunto:null,items:[]};

if(m=t.match(/^(?:esque[cç]a|apague|n[aã]o precisa lembrar(?: d[eoa])?)\s+(.+)$/i))return R({intencao:"esquecer",assunto:m[1].replace(/[.!]$/,"").replace(/^(?:sobre|a informa[cç][aã]o (?:sobre|de)|meu|minha|o|a)\s+/i,"")});
if(m=t.match(/^(?:guarde|memorize|grave|registre|anote|lembre-se)(?:\s+isso)?(?:\s+na sua mem[oó]ria)?(?:\s+(?:que|de que))?\s*[:,]?\s*([\s\S]*)$/i)){let b=m[1].trim();if(!b||/^(isso|esta informa[cç][aã]o|essa informa[cç][aã]o)[.!]?$/i.test(b))b=ctx.prevUser()||"";
if(!b)return R({aviso:"O que devo memorizar? Diga, por exemplo: “memorize que meu projeto se chama JORNADA”."});
const it=this.classify(b);return R({intencao:"memorizar",temporal:"permanente",items:it.length?it:[this.nota(b)]})}
if(m=t.match(/^(?:quero|vou)\s+(?:te\s+)?ensinar(?:\s+(?:voc[eê]\s+)?(?:sobre|a hist[oó]ria d[eoa]s?|a|o))?\s+(.+)$/i))return R({intencao:"ensinar",assunto:m[1].replace(/[.!]$/,"")});
if(m=t.match(/^(?:procure|busque|pesquise)\s+(?:no|nos)?\s*(?:documentos?|arquivo)?\s*(?:a informa[cç][aã]o\s+)?(?:sobre|de|do|da)?\s*(.+)$/i))return R({intencao:"buscar_doc",assunto:m[1]});
if(/^(quais|quantos)\s+documentos/.test(n))return R({intencao:"listar_docs"});
if(/mostre o que voce aprendeu|o que voce lembra\??$/.test(n))return R({intencao:"mostrar"});
if(/(qual e o seu nome|como voce se chama|quem e voce|quem voce e)/.test(n))return R({intencao:"consultar_identidade"});
if(/^quem sou eu\??$/.test(n))return R({intencao:"consultar_usuario",chave:"nome"});
if(m=t.match(/^qual\s+(?:é|e)\s+(?:o\s+|a\s+)?(?:meu|minha)\s+(.+?)\??$/i))return R({intencao:"consultar_usuario",chave:m[1]});
if(m=t.match(/(?:o que voc[eê] sabe (?:sobre|de|do|da)|me fale (?:sobre|de|do|da)|fale (?:sobre|de|do|da)|voc[eê] lembra (?:de|do|da|sobre))\s+(.+?)\??$/i))return R({intencao:"consultar_assunto",assunto:m[1]});
const it=this.classify(t);if(it.length)return R({intencao:"informar",temporal:"permanente",items:it});
if(m=t.match(/^(estou|tô|to|me sinto|ando)\s+(.+?)[.!]?$/i))return R({tipo:"relato",intencao:"estado",temporal:/\b(hoje|agora|no momento)\b/.test(n)?"presente":"indefinido",verbo:m[1].toLowerCase(),resto:m[2]});
if(/^(ola|oi|bom dia|boa tarde|boa noite)\b[\s,.!]*([a-z]+)?[\s.!]*$/.test(n))return R({intencao:"saudacao"});
return R({})}};

ask({k:"know",rec},"Analisei o conteúdo ("+t.length+" caracteres, "+a.n+" frases).\nAssunto provável: "+a.assunto+"\nPalavras-chave: "+a.tags.slice(0,6).join(", ")+"\nResumo: "+a.resumo+"\n\nDeseja que eu aprenda esse conteúdo?")}

const same=all.find(x=>x.hash===d.hash);if(same)return say("“"+f.name+"” já foi importado em "+same.data+" (conteúdo idêntico). Ignorei para não duplicar.");
const ver=all.find(x=>x.nome===d.nome);await DB.put("docs",d);const a=analyze(d.chunks.join(" "),d.nome);
say("Analisei “"+d.nome+"”: "+(d.paginas?d.paginas+" páginas, ":"")+d.chars+" caracteres, "+d.chunks.length+" trechos.\nAssunto provável: "+a.assunto+"\nPalavras-chave: "+a.tags.slice(0,6).join(", ")+"\nResumo: "+a.resumo+(a.rel.length?"\nInformação com data/número, por exemplo: “"+a.rel[0].slice(0,140)+"”":"")+(ver?"\n(Já havia uma versão com este nome e conteúdo diferente; mantive as duas.)":"")+"\n\nDeseja que eu aprenda esse conteúdo?");
