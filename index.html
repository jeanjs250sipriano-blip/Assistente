    if (modo === "chat") { Context.candidatos = r.items; Context.candN = Sess.n; return say("Entendi: " + r.items.map(desc).join("; ") + "." + dica()); }
    return Act.memorizar(r, "Percebi uma informação: ");
  },

  async esquecer(r) {
    const h = (await Retrieve.find(r.assunto, 3)).filter(x => x.src !== "documento");
    if (!h.length) return say("Não encontrei nada guardado sobre isso.");
    ask({ k: "del", x: h[0] }, "Encontrei:\n" + fmt(h[0]) + "\nDevo esquecer?");
  },

  async ensinar(r) {
    Context.setTopic(r.assunto);
    Context.addEntity(r.assunto);
    say("Certo, vamos falar sobre “" + r.assunto + "”. Pode escrever, falar ou anexar um arquivo (📎). Eu mostro o que entendi e só salvo se você confirmar.");
  },

  async aprender_texto(r) { return learnText(r.texto); },

  async consultar_identidade() {
    const name = await Identity.getAssistantName();
    say("Meu nome é " + name + ".");
  },

  async consultar_usuario(r) {
    const k = norm(r.chave);
    const all = await DB.all("memory");
    const f = all.filter(m =>
      m.camada !== "identidade" &&
      (norm(m.chave) === k || norm(m.chave).includes(k) || (m.assunto && norm(m.assunto).includes(k)))
    );
    if (f.length) {
      const best = f.sort((a, b) => (b.importancia || 5) - (a.importancia || 5))[0];
      say("Seu(sua) " + best.chave + " é " + best.valor + ".");
      Context.addEntity(best.valor);
      if (best.chave === "nome") Context.ultimaPessoa = best.valor;
    } else {
      if (k === "nome" || /nome/.test(k)) {
        Context.attrFoco = { attr: "nome", n: Sess.n };
        say("Ainda não sei quem você é. Se quiser, me diga seu nome.");
      } else {
        say("Não tenho essa informação guardada. Quer me ensinar?");
      }
    }
  },

  async consultar_assunto(r) {
    let q = r.assunto;
    if (/^(ele|ela|isso|aquilo|isto)$/i.test(q) && Context.topico) q = Context.topico;
    Context.setTopic(q);
    const h = await Retrieve.find(q, 6);
    if (h.length) say("Sobre “" + q + "” eu tenho:\n\n" + h.map(fmt).join("\n"));
    else say("Ainda não aprendi nada sobre “" + q + "”. Se quiser, me ensine no Modo Treinamento ou diga “aprenda isso” com o conteúdo.");
  },

  async mostrar() {
    const a = [...await DB.all("memory"), ...await DB.all("knowledge")];
    if (!a.length) return say("Ainda não guardei nada.");
    say(a.slice(0, 15).map(x => "• [" + (x.camada || "usuario") + "] " + (x.chave || x.assunto || x.titulo) + ": " + String(x.valor || x.conteudo).slice(0, 90)).join("\n") + "\n\nVeja tudo, com origem e importância, em ☰ Memória.");
  },

  async buscar_doc(r) {
    const h = (await Search.docs(r.assunto)).slice(0, 3);
    say(h.length ? "Encontrei:\n\n" + h.map(x => "📄 " + x.nome + "\n“" + x.trecho.slice(0, 260) + "…”").join("\n\n") : "Não encontrei esse assunto nos documentos armazenados.");
  },

  async listar_docs() {
    const d = await DB.all("docs");
    say(d.length ? d.map(x => "• " + x.nome + " (" + x.chars + " caracteres" + (x.aprendido ? ", no conhecimento" : "") + ")").join("\n") : "Nenhum documento importado.");
  },

  async conversar(r) {
    if (r.aviso) return say(r.aviso);

    // Só aprende texto longo automaticamente no Modo Treinamento.
    // No chat, aprendizado só com comando explícito no início da frase.
    if (r.tipo === "afirmacao" && modo === "treino" && r.t.length >= 25)
      return learnText(r.t);

    // Resolver referências e buscar contexto
    const ref = ReferenceResolver.resolve(r.t, Context);
    const query = ref.topic ? (r.t + " " + ref.topic) : r.t;
    const h = (r.tipo === "pergunta" || r.ref) ? await Retrieve.find(query, 3) : [];

    if (h.length && !(modo === "chat" && await AIProvider.canUseGemini() && !/\b(o que voc[eê] (sabe|lembra)|lembra|guardou|mem[oó]ria)\b/i.test(r.t))) {
      Context.setTopic(ref.topic || Context.topico);
      return say("Isto é o que tenho guardado:\n\n" + h.map(fmt).join("\n"));
    }

    if (r.tipo === "pergunta") {
      // Última tentativa local: capacidade?
      const cap = Capabilities.answer(r.t);
      if (cap) return say(cap);

      // Fallback Gemini (só se o botão estiver ligado e houver cota)
      if (await AIProvider.canUseGemini()) {
        const gem = await AIProvider.generateResponse(r.t);
        if (gem && gem.text) return say(gem.text);
        if (gem && gem.error) return say("Não consegui usar a IA agora: " + gem.error + "\nVocê pode me ensinar no Modo Treinamento.");
      }
      return say("Não encontrei nada guardado sobre isso. " +
        (Cfg.v.geminiEnabled ? "O Gemini está ligado, mas não consegui obter resposta (verifique a chave ou o limite diário)." :
          "Ative o Gemini nas Configurações (☰ → Config) se quiser que eu use IA para responder.") +
        " Você também pode me ensinar no Modo Treinamento.");
    }

    // Afirmações / conversa livre → tenta Gemini se ligado
    // Com Gemini ligado, mesmo respostas curtas usam o histórico da conversa
    if (await AIProvider.canUseGemini() && r.t.trim().length >= 1) {
      const gem = await AIProvider.generateResponse(r.t);
      if (gem && gem.text) return say(gem.text);
      if (gem && gem.error) Log.add("gemini conversar", gem.error);
    }

    const w = Worth.assess(r.t);
    if (w.classe === "informacao") { Context.candidatos = [w.item]; Context.candN = Sess.n; if (modo === "chat") return say("Entendi." + dica()); pending = { k: "mem", items: [w.item], o: "conversa" }; return say("Isso parece uma informação sobre você: “" + w.item.valor.slice(0, 140) + "”. Quer que eu guarde como nota?"); }
    if (w.classe === "estado") return say("Entendi.");
    if (w.classe === "opiniao") return say("Entendi, é a sua opinião.");
    if (w.classe === "social") return say("Certo.");
    say("Entendi." + dica());
  }
};

async function doConfirm(p) {
  if (p.k === "mem") {
    Context.candidatos = null;
    const out = [];
    for (const it of p.items) {
      const s = await Mem.save(it, p.o);
      if (s.st === "novo") out.push("Informação armazenada: " + it.chave + " = " + it.valor + ".");
      else if (s.st === "atualizado") out.push("Atualizei “" + it.chave + "”: de “" + s.de + "” para “" + it.valor + "”.");
      else out.push("Eu já sabia: " + it.chave + " = " + it.valor + ".");
      if (it.chave === "nome" && it.camada === "usuario") Context.ultimaPessoa = it.valor;
      if (it.assunto) Context.addEntity(it.assunto);
    }
    say(out.join("\n"));
  } else if (p.k === "know") {
    await DB.put("knowledge", p.rec);
    Sess.saved++;
    Context.setTopic(p.rec.assunto);
    say("Aprendido: “" + p.rec.assunto + "”. Origem: " + p.rec.origem + ".");
  } else if (p.k === "del") {
    const storeMap = { "memória": "memory", "conhecimento": "knowledge", "episódio": "episodes" };
    await DB.del(storeMap[p.x.src] || "memory", p.x.rec.id);
    say("Esquecido.");
  } else if (p.k === "doc") {
    p.d.aprendido = true;
    await DB.put("docs", p.d);
    const k = knRec(p.a, "documento: " + p.d.nome, p.d.hash);
    k.docId = p.d.id;
    await DB.put("knowledge", k);
    Sess.saved++;
    Context.setTopic(p.a.assunto);
    say("Aprendi o conteúdo de “" + p.d.nome + "” sobre “" + p.a.assunto + "”.");
  }
}

const SYS = new Set("ajuda backup painel modo aprender_texto esquecer memorizar ensinar buscar_doc listar_docs mostrar capacidade saudacao despedida consultar_assunto".split(" "));
const VERBO_SALVAR = /\b(anot[ae]r?|guard[ae]r?|memoriz[ae]r?|grav[ae]r?|registr[ae]r?|salv[ae]r?|escrev[ae]r?|lembr[ae](?:-se)?|adicion[ae]r?|colo(?:ca|que|car)|bota(?:r)?|n[aã]o esque[cç]a)\b/i;
function explicito(t) {   // Só aceita comando de salvar se o verbo estiver no COMEÇO da frase
  // Exemplos válidos: "Salva isso: …", "Anota que eu sou o Jean", "Guarde na memória que…"
  // Exemplos inválidos: "Eu tava falando e você perguntava pra salvar" (verbo no meio)
  t = t.trim();
  if (/\?\s*$/.test(t) || /^(voc[eê]|vc)\b/i.test(t)) return null;
  // Remove interjeições comuns do início para achar o verbo de comando
  const limpo = t.replace(/^(por favor|pfv|pf|oi|olá|ei|e aí|eai)[,!\s]+/i, "").trim();
  const m = limpo.match(VERBO_SALVAR);
  // Verbo precisa estar nos primeiros ~25 caracteres (começo real da ordem)
  if (!m || m.index > 25) return null;
  const resto = limpo.slice(m.index + m[0].length);
  if (!/(isso|isto|a[ií]\b|mem[oó]ria|banco de dados|cadastro|\bque\b|:)/i.test(resto.slice(0, 70))) return null;
  const alvo = /^\s*[,:]?\s*(?:isso|isto|essa informa[cç][aã]o|esta informa[cç][aã]o|a[ií])?\s*(?:(?:na|em|no|para a|pra)\s+(?:sua|seu)\s+(?:mem[oó]ria|banco de dados|cadastro)(?:\s+de dados)?)?\s*(?:que\b|:|,)?\s*/i;
  return { conteudo: resto.replace(alvo, "").trim() };
}
const dica = () => Context.dicaMem ? "" : (Context.dicaMem = true, "\n(Isso fica só na conversa. Para eu guardar de vez, diga “anota isso”.)");
async function salvarExplicito(txt) {
  const nseg = txt.split(/\n+|(?<=[.!?])\s+/).filter(x => x.trim()).length;
  const pessoal = (txt.match(/\b(eu|meu|minha|meus|minhas|moro|nasci|sou|tenho|trabalho|gosto)\b/gi) || []).length;
  if (nseg >= 4 && pessoal < nseg / 3) {   // texto informativo → conhecimento
    const a = analyze(txt), rec = knRec(a, "comando na conversa", hash(txt));
    rec.trechos = txt.match(/[\s\S]{1,900}(?:\s|$)/g) || [txt];
    await DB.put("knowledge", rec); Sess.saved++;
    return say("Anotado no conhecimento: “" + rec.assunto + "”.");
  }
  let items = await Mind.extract(txt);
  if (!items.length) items = [Worth.assess(txt).item || { camada: "usuario", categoria: "nota", chave: (kw(txt, 2).join(" ") || "nota") + " (nota)", valor: txt, importancia: 6 }];
  return await doConfirm({ k: "mem", items, o: "conversa" });
}
async function handle(text) {
  text = text.trim();
  if (!text) return;
  bubble("u", text);
  Context.push("u", text);
  Sess.n++;
  kw(text, 3).forEach(w => Sess.tok[w] = (Sess.tok[w] || 0) + 1);

  try {
    const words = text.trim().split(/\s+/).length;
    const yes = words <= 5 && /\b(sim|pode|confirmo|claro|com certeza|guarde|memorize|isso mesmo)\b/i.test(text) && !/\bn[aã]o\b/i.test(text);
    const no = words <= 5 && /^\W*(n[aã]o|cancela|deixa|esquece)\b/i.test(text);
    if (pending && pending.k === "esclarece") {   // "você está falando de quem?"
      const p = pending; pending = null;
      const o = p.op.find(n => norm(text).includes(norm(n)));
      if (o) { await Mind.run(p.s.replace(/\b(ele|ela)\b/i, o), {}); return; }
      return say("Tudo bem, deixo isso de lado por enquanto.");
    }
    if (pending && pending.k === "contra") {   // contradição: corrigir ou outra situação?
      const p = pending; pending = null;
      if (/corrig|atualiz|mudou|sim|isso/i.test(text) && !/outra/i.test(text)) {
        (p.e.attrs[p.a] = p.e.attrs[p.a] || []).push({ valor: p.valor, neg: !!p.neg, temp: p.temp || null, dia: today(), fonte: "correção", conf: 0.9 });
        const it = { camada: "usuario", categoria: "pessoa", chave: p.e.nome + (p.e.rel ? " (" + p.e.rel + ")" : "") + " — " + p.a, valor: p.valor, assunto: p.e.nome, ent: p.e.nome, rel: p.e.rel, attr: p.a, importancia: 6 };
        return ask({ k: "mem", items: [it], o: "correção" }, "Certo, usei a informação nova: " + cap(phr(who(p.e), { valor: p.valor, neg: p.neg }, p.a)) + ". Quer que eu memorize a correção?");
      }
      return say("Certo. Me diga de quem ou de que situação se trata, para eu não misturar as duas informações.");
    }
    if (pending) {
      const p = pending; pending = null;
      if (yes) return await doConfirm(p);
      if (no) { Context.candidatos = null; return say("Tudo bem, não salvei."); }
    }
    if (yes && Context.candidatos && Sess.n - Context.candN <= 4) return await doConfirm({ k: "mem", items: Context.candidatos, o: "conversa" });   // "Disse sim!" / "Memorize isso" depois de a pergunta ter passado
    if (no && Context.candidatos) { Context.candidatos = null; return say("Tudo bem, não salvei."); }

    // Comandos de interação visual funcionam no chat e na aba Interagir
    if (modo !== "treino") {
      const av = Avatar.tryCommand(text);
      if (av) return say(av);
    }

    // Modo Live (áudio em tempo real)
    if (/\b(modo live|live mode|conversa ao vivo|voz ao vivo)\b/i.test(text)) {
      if (GeminiLive.isOn()) {
        GeminiLive.stop();
        return say("Modo Live desligado.");
      }
      const ok = await GeminiLive.start();
      return say(ok ? "Modo Live ligado. Fale pelo microfone — eu respondo com a voz do Gemini. Diga “parar live” para encerrar." : "Não consegui iniciar o Live.");
    }
    if (/\b(parar live|stop live|desliga live|encerra live)\b/i.test(text)) {
      GeminiLive.stop();
      return say("Modo Live desligado.");
    }
    if (GeminiLive.isOn()) {
      GeminiLive.sendText(text);
      return; // resposta vem por áudio + transcrição
    }

    // Geração de imagem (Gemini)
    const imgM = text.match(/^(?:gera(?:r)?|crie|cria|desenha|faz)\s+(?:uma?\s+)?(?:imagem|foto|figura|desenho)\s*(?:de|do|da|com)?\s*(.+)$/i)
      || text.match(/^(?:gera(?:r)?|crie|cria)\s+(?:uma?\s+)?imagem[:\s]+(.+)$/i);
    if (imgM && await AIProvider.canUseGemini()) {
      showTyping();
      const r = await GeminiImage.generate(imgM[1].trim());
      hideTyping();
      return GeminiImage.showInChat(r);
    }

    const ex = explicito(text);
    if (ex && modo === "chat") {   // só guarda quando o usuário manda; sem perguntar "quer que eu anote?"
      const txt = (ex.conteudo || Context.prevUser() || "").replace(/^Entendi:\s*/i, "").trim();
      if (!txt) return say("O que devo anotar? Diga, por exemplo: “anota que eu sou o Jean”.");
      return await salvarExplicito(txt);
    }
    if (/^\W*(sim|claro)\W*$/i.test(text)) return say("Sim para quê? Não tenho nada aguardando sua confirmação.");
    if (/^\W*(guarde|memorize|grave|anote)(\s+(isso|isto|essa informa[cç][aã]o|esta informa[cç][aã]o))?\W*$/i.test(text)) {   // "memorize isso" → reinterpreta a fala anterior
      const prev = (Context.prevUser() || "").replace(/^Entendi:\s*/i, "").trim();
      if (!prev) return say("O que devo memorizar? Diga, por exemplo: “guarde que meu projeto se chama JORNADA”.");
      const its = await Mind.extract(prev);
      if (its.length) { Context.candidatos = its; Context.candN = Sess.n; return ask({ k: "mem", items: its, o: "conversa" }, "Entendi:\n• " + its.map(desc).join("\n• ") + "\nDeseja que eu memorize isso?"); }
      const it = Worth.assess(prev).item || { camada: "usuario", categoria: "nota", chave: (kw(prev, 2).join(" ") || "nota") + " (nota)", valor: prev, importancia: 6 };
      return ask({ k: "mem", items: [it], o: "conversa" }, "Não identifiquei um fato estruturado. Posso guardar como nota: “" + prev.slice(0, 140) + "”. Deseja que eu memorize?");
    }
    const r = Core.interpret(text, Context);
    if (r.intencao === "memorizar" && r.items.length === 1 && r.items[0].categoria === "nota") {   // tenta estruturar antes de guardar como nota
      const txt = String(r.items[0].valor), nseg = txt.split(/\n+|(?<=[.!?])\s+/).filter(x => x.trim()).length;
      const pessoal = (txt.match(/\b(eu|meu|minha|meus|minhas|moro|nasci|sou|tenho|trabalho|gosto)\b/gi) || []).length;
      if (nseg >= 4 && pessoal < nseg / 3) return learnText(txt);   // texto informativo sobre um assunto → conhecimento, não memória pessoal
      const its = await Mind.extract(txt);
      if (its.length) r.items = its;
    }
    if (r.intencao === "informar" && (/\n/.test(text) || /[.?!]\s+\S/.test(text) || /\s(e|mas)\s+[A-ZÁÀÂÃÉÊÍÓÔÕÚÇ]/.test(text))) r.intencao = "conversar";
    if (!SYS.has(r.intencao) && await Mind.run(text, r)) { Context.ultimaIntencao = r.intencao; return; }
    Context.ultimaIntencao = r.intencao;
    Log.add("interpretado: " + r.tipo + " / " + r.intencao + " / conf=" + (r.confianca || 0).toFixed(2));

    // Atualiza entidades/tópico a partir de itens
    if (r.items && r.items.length) {
      r.items.forEach(it => {
        if (it.chave === "nome" && it.camada === "usuario") Context.ultimaPessoa = it.valor;
        if (it.assunto) Context.addEntity(it.assunto);
        if (it.chave && it.chave !== "nome") Context.addEntity(it.chave);
      });
    }

    return await (Act[r.intencao] || Act.conversar)(r);
  } catch (e) {
    Log.add("handle", e);
    sys("Algo deu errado: " + e.message);
  }
}

async function importFile(f) {
  try {
    setSt("Lendo arquivo…");
    $("#dot").className = "dot busy";
    const d = await Docs.process(f);
    const all = await DB.all("docs");
    const same = all.find(x => x.hash === d.hash);
    if (same) return say("“" + f.name + "” já foi importado em " + same.data + " (conteúdo idêntico). Ignorei para não duplicar.");
    const ver = all.find(x => x.nome === d.nome);
    await DB.put("docs", d);
    const a = analyze(d.chunks.join(" "), d.nome);
    say("Analisei “" + d.nome + "”: " + (d.paginas ? d.paginas + " páginas, " : "") + d.chars + " caracteres, " + d.chunks.length + " trechos.\nAssunto provável: " + a.assunto + "\nPalavras-chave: " + a.tags.slice(0, 6).join(", ") + "\nResumo: " + a.resumo + (a.rel.length ? "\nInformação com data/número, por exemplo: “" + a.rel[0].slice(0, 140) + "”" : "") + (ver ? "\n(Já havia uma versão com este nome e conteúdo diferente; mantive as duas.)" : "") + "\n\nDeseja que eu aprenda esse conteúdo?");
    pending = { k: "doc", d, a };
  } catch (e) {
    Log.add("importar", e);
    sys("Não foi possível ler este arquivo: " + e.message);
  } finally {
    setSt("Pronta");
    $("#dot").className = "dot";
  }
}

async function switchMode(m, first) {
  if (!first) await Episodes.consolidate();
  modo = m;
  Sess.mode = m;
  pending = null;
  Context.clearSession();

  const isInt = m === "interagir";
  const isTrain = m === "treino";

  $("#chat").style.display = isInt ? "none" : "flex";
  $("#interact").style.display = isInt ? "flex" : "none";
  $("#mChat").className = m === "chat" ? "on" : "";
  $("#mInt").className = isInt ? "on" : "";
  $("#mTr").className = isTrain ? "on" : "";
  $("#trB").style.display = isTrain ? "block" : "none";
  $("#in").placeholder = isTrain
    ? "Ensine algo à " + Cfg.v.nome + "…"
    : isInt
      ? "Fale comigo ou diga: strip, dança, sexy…"
      : "Escreva uma mensagem…";

  // limpa os dois containers de chat
  $("#chat").innerHTML = "";
  $("#interactChat").innerHTML = "";

  if (isInt) {
    Avatar.bindButtons();
    Avatar.render();
  }

  // Conversar e Interagir compartilham o mesmo histórico (modo "chat")
  const histKey = (m === "interagir" || m === "chat") ? "chat" : m;
  const h = (await DB.all("messages")).filter(x => (x.modo || "chat") === histKey).sort((a, b) => a.t - b.t).slice(-40);
  h.forEach(x => { bubble(x.role, x.text, false); Context.push(x.role, x.text); });

  if (!h.length) {
    if (isTrain) sys("Comece com “Quero te ensinar sobre …”. Depois escreva, fale 🎙 ou anexe 📎 um arquivo.");
    else if (isInt) say("Oi… aqui você me vê. Pode falar comigo normalmente ou usar os botões. Comandos: strip, dança, sexy, comportada, veste…");
    else say("Olá! Sou a " + Cfg.v.nome + ". Tudo o que guardo fica só neste aparelho. Digite /ajuda.");
  }
}

/* ===== Painel (Memória, Aprendizado, Backup, Config, Diagnóstico) ===== */
const TABS = { mem: "Memória", apr: "Aprendizado", bk: "Backup", cf: "Config", dg: "Diagnóstico", av: "🎭 Avatar" };
function openSheet(t = "mem") {
  $("#sheet").style.display = "flex";
  $("#tabs").innerHTML = "";
  for (const k in TABS) {
    const b = document.createElement("button");
    b.textContent = TABS[k];
    b.className = k === t ? "on" : "";
    b.onclick = () => openSheet(k);
    $("#tabs").appendChild(b);
  }
  if (t === "av") { const bb = $("#body"); if (bb) bb.innerHTML = ""; return Avatar.renderAvatarTab(); }
  const fn = ({ mem: tMem, apr: tApr, bk: tBk, cf: tCf, dg: tDg })[t];
  if (fn) Promise.resolve(fn()).catch(e => Log.add("sheet", e));

async function tMem() {

  async function draw() {
    box.innerHTML = "";
    const f = norm(q.value);
    const rows = [
      ...(await DB.all("memory")).map(x => ({ s: "memory", x, c: x.camada || "usuario", h: x.chave, v: x.valor })),
      ...(await DB.all("knowledge")).map(x => ({ s: "knowledge", x, c: "conhecimento", h: x.assunto || x.titulo, v: x.valor || x.conteudo || "" })),
      ...(await DB.all("episodes")).map(x => ({ s: "episodes", x, c: "episodica", h: "Lembrança de " + x.criadoEm, v: x.resumo })),
      ...(await DB.all("docs")).map(x => ({ s: "docs", x, c: "documento", h: x.nome, v: x.chars + " caracteres, " + x.chunks.length + " trechos" + (x.aprendido ? " · no conhecimento" : "") }))
    ].filter(r => (!sl.value || r.c === sl.value) && (!f || norm(r.h + " " + r.v).includes(f)));
    if (!rows.length) box.innerHTML = '<div class="it">Nada armazenado ainda.</div>';
    rows.forEach(r => {
      const x = r.x;
      const meta = [x.origem, x.atualizadoEm || x.criadoEm || x.data, x.importancia != null ? "importância " + x.importancia + "/10" : "", x.usos ? "usada " + x.usos + "x" : "", x.anterior && x.anterior.length ? "atualizada " + x.anterior.length + "x" : ""].filter(Boolean).join(" · ");

        const k = r.s === "episodes" ? "resumo" : (r.s === "knowledge" && x.valor === undefined ? "conteudo" : "valor");

        if (n !== null) { x[k] = n; x.atualizadoEm = today(); await DB.put(r.s, x); draw(); }
      });
      btn(row, "Excluir", async () => { if (window.confirm("Excluir?")) { await DB.del(r.s, x.id); draw(); } });
    });
  }
  q.oninput = draw; sl.onchange = draw; draw();
}

function download(o, n) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 1)], { type: "application/json" }));
  a.download = n;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===== Eventos (Gemini-first) ===== */
let pendingImage = null; // { mime, data, name }

function clearPendingImage() {
  pendingImage = null;
  const prev = $("#imgPreview");
  if (prev) prev.classList.remove("show");
}

function setPendingImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) return reject(new Error("Não é imagem"));
    const fr = new FileReader();
    fr.onload = () => {
      const dataUrl = fr.result;
      const b64 = dataUrl.split(",")[1];
      pendingImage = { mime: file.type, data: b64, name: file.name };
      const prev = $("#imgPreview");
      if (prev) {
        $("#imgPrevThumb").src = dataUrl;
        $("#imgPrevName").textContent = file.name;
        prev.classList.add("show");
      }
      resolve(pendingImage);
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

async function send() {
  const t = ($("#in").value || "").trim();
  const img = pendingImage;
  $("#in").value = "";
  $("#in").style.height = "auto";
  if (Voice.active()) Voice.stopAndClear();
  try { speechSynthesis.cancel(); } catch (e) {}
  try { GeminiAudio.stop(); } catch (e) {}

  // Live ativo: só encaminha texto
  if (GeminiLive.isOn()) {
    if (t) {
      bubble("u", t);
      Context.push("u", t);
      GeminiLive.sendText(t);
    }
    return;
  }

  // Imagem para análise (visão Gemini)
  if (img) {
    clearPendingImage();
    bubble("u", (t || "Analise esta imagem") + "\n📷 " + (img.name || "imagem"));
    Context.push("u", t || "Analise esta imagem");
    if (!(await AIProvider.canUseGemini())) {
      return say("Ligue o Gemini e configure a chave para analisar imagens.");
    }
    showTyping();
    const r = await AIProvider.generateResponse(t || "Descreva e analise esta imagem em português, com detalhes úteis.", null, img);
    hideTyping();
    if (r && r.text) {
      say(r.text);
    } else {
      say((r && r.error) || "Não consegui analisar a imagem.");
    }
    return;
  }

  if (!t) return;
  handle(t);
}
$("#bSend").onclick = send;

// Live: botão dedicado (como no app do Gemini)
$("#bLive").onclick = async () => {
  if (GeminiLive.isOn()) {
    GeminiLive.stop();
    $("#bLive").classList.remove("on");
    $("#bMic").classList.remove("on");
    sys("Live desligado.");
    return;
  }
  if (!(await AIProvider.canUseGemini())) {
    return sys("Ligue o Gemini e cole a chave em ☰ → Config.");
  }
  try { speechSynthesis.cancel(); } catch (e) {}
  try { GeminiAudio.stop(); } catch (e) {}
  if (Voice.active()) Voice.stopAndClear();
  const ok = await GeminiLive.start();
  if (ok) {
    $("#bLive").classList.add("on");
    $("#bMic").classList.add("on");
    sys("Live ativo — fale no microfone. Toque ⏺ de novo para parar.");
  } else {
    $("#bLive").classList.remove("on");
  }
};

// Microfone: com Gemini → Live; sem Gemini → ditado local no campo
$("#bMic").onclick = async () => {
  if (GeminiLive.isOn()) {
    GeminiLive.stop();
    $("#bLive").classList.remove("on");
    $("#bMic").classList.remove("on");
    sys("Live desligado.");
    return;
  }
  if (Cfg.v.geminiEnabled && Cfg.v.geminiKey) {
    // Atalho: microfone liga o Live (voz Gemini ponta a ponta)
    $("#bLive").click();
    return;
  }
  // Fallback local só se Gemini estiver off
  if (Voice.active()) {
    Voice.stop();
    $("#bMic").classList.remove("on");
    $("#dot").className = "dot";
    setSt("Pronta");
    return;
  }
  $("#bMic").classList.add("on");
  $("#dot").className = "dot on";
  setSt("● Ouvindo… (local)");
  Voice.listen(
    t => {
      $("#in").value = t;
      const ta = $("#in");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    },
    finalText => {
      $("#bMic").classList.remove("on");
      $("#dot").className = "dot";
      setSt("Pronta");
      if (finalText) {
        $("#in").value = finalText;
        const ta = $("#in");
        ta.style.height = "auto";
        ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
      }
    }
  );
};
